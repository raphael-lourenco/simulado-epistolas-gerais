const DISSERTATIVAS = [{"numero": 1, "topico": "pe2_autoria", "enunciado": "Carson, Moo e Morris apresentam objeções à autoria petrina de 2 Pedro e depois as refutam. Escolha uma dessas objeções e explique como os autores a refutam, defendendo a posição tradicional.", "gabarito": "Escolha <strong>uma<\/strong>: 1) <strong>Estilo diferente de 1 Pedro<\/strong> → secretários diferentes; um escrito antigo com o nome do autor deve ser aceito como dele, salvo forte evidência contrária. 2) <strong>Paulo como Escritura (3.15-16)<\/strong> → não há menção de coleção oficial; Paulo já se via inspirado; Pedro pode ter sido o primeiro a reconhecer isso; e o “difíceis de entender” é humilde demais para um imitador. 3) <strong>“Os pais” (3.4)<\/strong> → no NT a expressão nunca designa os primeiros cristãos; são os patriarcas; e está na boca dos falsos mestres. 4) <strong>Uso de Judas<\/strong> → não está provado que Judas é a fonte, e não sabemos o que um apóstolo usaria. 5) <strong>Ensino falso/gnosticismo<\/strong> → nenhum sistema gnóstico conhecido é paralelo a 2 Pedro. 6) <strong>Motivo<\/strong> → pseudepígrafes promoviam heterodoxia; 2 Pedro é ortodoxa e não precisava de um grande nome. <strong>Conclusão:<\/strong> nenhum argumento conclusivo contra; aceitar a carta como do apóstolo Pedro.", "fonte": ["p-1-1", "p-1-2", "b-1-1", "b-5-1", "b-6-1", "b-7-1", "b-8-1", "b-9-0", "b-9-1"], "destaque": true}, {"numero": 2, "topico": "pe2_autoria", "enunciado": "Uma das objeções à autoria petrina de 2 Pedro é o uso que a carta faz de Judas. Explique a objeção e como Carson, Moo e Morris a refutam.", "gabarito": "<strong>Objeção:<\/strong> um apóstolo não usaria um escrito de quem não era apóstolo; como 2 Pedro usa Judas, Pedro não pode ser o autor. <strong>Refutação:<\/strong> a objeção depende de <strong>duas pressuposições<\/strong>. (1) Que <strong>Judas é a fonte<\/strong> de 2 Pedro: possível, mas <strong>não comprovado<\/strong>, e alguns veem a dependência no sentido inverso (Guthrie: das 297 palavras de 2 Pedro e 256 de Judas, só 78 são comuns, e nenhum dos dois é sempre mais conciso). (2) Que um apóstolo <strong>não usaria um escrito não apostólico<\/strong>: não temos condições de dizer o que um apóstolo usaria. Pedro poderia incorporar <strong>palavras úteis, não importando onde as encontrasse<\/strong>.", "fonte": ["b-7-0", "b-7-1", "b-10-1"], "destaque": true}, {"numero": 3, "topico": "pe2_autoria", "enunciado": "Explique a objeção à autoria petrina baseada na referência às cartas de Paulo como “Escrituras” (2Pe 3.15-16) e a resposta dada por Carson, Moo e Morris.", "gabarito": "<strong>Objeção:<\/strong> a referência pressupõe uma <strong>coleção oficial<\/strong> das cartas de Paulo, improvável no tempo de Pedro, e chamá-las de “Escrituras” seria tardio. <strong>Resposta:<\/strong> 2 Pedro <strong>não fala de coleção<\/strong>; “todas as suas epístolas” pode ser só as cartas que Pedro conhecia, e a carta revela pouco conhecimento das doutrinas de Paulo. Quanto a “Escrituras”, o próprio <strong>Paulo já considerava seus escritos inspirados e autorizados<\/strong> (1Co 7.40; 14.37); não há evidência de um período em que Paulo foi negligenciado, e nada impede que <strong>Pedro tenha sido o primeiro a reconhecer a mão de Deus<\/strong> nos escritos de Paulo. A favor de Pedro: o humilde reconhecimento de que Paulo é “<strong>difícil de entender<\/strong>”, algo que um imitador não poria na boca do apóstolo.", "fonte": ["b-5-0", "b-5-1", "b-5-2", "b-5-3"], "destaque": true}, {"numero": 4, "topico": "pe2_autoria", "enunciado": "Explique a objeção à autoria petrina de 2 Pedro baseada na expressão “os pais” (3.4) e como ela é refutada.", "gabarito": "<strong>Objeção:<\/strong> Pedro morreu cedo demais para chamar os primeiros líderes cristãos de “os pais”; a expressão indicaria uma geração posterior. <strong>Refutação:<\/strong> em <strong>nenhum outro versículo do NT<\/strong> “os pais” designa os primeiros cristãos; o mais provável é que se refira aos <strong>patriarcas judeus<\/strong>, como em outros textos. Também não é provável que um escritor pseudônimo supusesse esse uso nos dias de Pedro. E a expressão <strong>não é do autor sobre si mesmo<\/strong>: ele a atribui aos <strong>falsos mestres<\/strong>. (A forma “nossos pais” vem de manuscritos inferiores.) Logo, <strong>a objeção não é decisiva<\/strong>.", "fonte": ["b-6-0", "b-6-1"], "destaque": true}, {"numero": 5, "topico": "pe2_autoria", "enunciado": "Explique a objeção à autoria petrina de 2 Pedro baseada na diferença de estilo e vocabulário em relação a 1 Pedro e a resposta dos defensores da autoria tradicional.", "gabarito": "<strong>Objeção:<\/strong> o estilo e a linguagem são bem diferentes dos de 1 Pedro; Bauckham mostra que 2 Pedro tem a <strong>maior proporção de hapax legomena do NT<\/strong> (57 palavras exclusivas, 32 fora da LXX) e um grego de judeus helenistas. <strong>Resposta:<\/strong> a diferença pode ser explicada pelo uso de <strong>secretários diferentes<\/strong>, ou por Pedro ter escrito uma das cartas pessoalmente e usado um secretário na outra; quase nada se sabe da contribuição de um secretário. Além disso, <strong>um escrito antigo que traz o nome do autor deve ser aceito como dele<\/strong>, a menos que haja fortes evidências em contrário.", "fonte": ["b-1-0", "b-1-1"], "destaque": true}, {"numero": 6, "topico": "pe2_autoria", "enunciado": "Explique a objeção à autoria petrina de 2 Pedro segundo a qual a carta combate o gnosticismo e mostre como Carson, Moo e Morris a refutam.", "gabarito": "<strong>Objeção:<\/strong> o autor combate ensinos <strong>gnósticos<\/strong>, que só surgiram bem depois de Pedro; logo a carta é tardia. <strong>Refutação:<\/strong> <strong>nenhum sistema gnóstico conhecido<\/strong> forma paralelo com o que 2 Pedro diz; afirmar que o autor combate o gnosticismo é <strong>ir além das evidências<\/strong> (Neyrey: “os oponentes não são gnósticos”). O gnosticismo do séc. 2 é um conjunto de sistemas ecléticos; alguns ensinos que depois atraíram os gnósticos já existiam na era apostólica, mas isso <strong>não é o gnosticismo em si<\/strong>. Opor-se a esse ensino não é motivo para dizer que o autor não era Pedro.", "fonte": ["b-8-0", "b-8-1"], "destaque": true}, {"numero": 7, "topico": "pe2_autoria", "enunciado": "Se 2 Pedro fosse uma pseudepígrafe, por que teria sido escrita? Explique o argumento do “motivo” usado por Carson, Moo e Morris em favor da autoria petrina.", "gabarito": "Havia escritos que usavam o nome de um grande personagem para dar respeitabilidade ao que diziam, mas <strong>todos promoviam ensinos não ortodoxos<\/strong>. <strong>2 Pedro é ortodoxa<\/strong>, em consonância com outros mestres cristãos, e poderia ser publicada com o nome do verdadeiro autor ou sem nome. Para escrever ortodoxia <strong>não era preciso apelar a um grande nome<\/strong>, e <strong>ninguém apresentou um motivo razoável<\/strong> para enviar a carta sob o nome de Pedro. Contra a tese de Bauckham (ficção transparente): o debate na igreja primitiva girava justamente em torno de a carta ser ou não de um apóstolo; se era transparente, por que tantos não perceberam? <strong>Conclusão:<\/strong> é melhor aceitá-la como escrito autêntico de Pedro.", "fonte": ["b-9-0", "b-9-1", "b-1-3"], "destaque": true}, {"numero": 8, "topico": "pe2_autoria", "enunciado": "Que indícios internos da própria carta Carson, Moo e Morris apresentam em favor da autoria petrina de 2 Pedro?", "gabarito": "1) O autor se identifica como “<strong>Simeão Pedro<\/strong>, servo e apóstolo” (1.1): forma rara (só At 15.14), natural para o próprio Pedro; um imitador usaria a forma de 1 Pedro. 2) Diz que o Senhor lhe mostrou que sua <strong>morte estava próxima<\/strong> (1.14). 3) Afirma ter sido <strong>testemunha ocular da transfiguração<\/strong> (1.16-18), com diferenças em relação aos evangelhos (sem Moisés e Elias, com o enfático <em>egō<\/em>), o que um imitador dificilmente faria. 4) Menciona uma <strong>carta anterior<\/strong> aos mesmos leitores (3.1). 5) Chama Paulo de “<strong>nosso amado irmão<\/strong>” (3.15), sinal de intimidade. Somam-se a isso a <strong>tradição<\/strong> (que atribui a carta uniformemente a Pedro) e a <strong>atestação<\/strong> melhor que a de qualquer livro rejeitado.", "fonte": ["b-3-0", "b-3-1", "b-3-2", "b-4-0", "b-2-0"], "destaque": true}, {"numero": 9, "topico": "judas_recentes", "enunciado": "Em “Judas em estudos recentes”, Carson, Moo e Morris discutem se Judas é um exemplo de “catolicismo primitivo”. Explique o que se entende por essa expressão e por que os autores rejeitam essa classificação para Judas.", "gabarito": "“Catolicismo primitivo” é expressão de <strong>significado incerto<\/strong>, muitas vezes <strong>pejorativa<\/strong>, mas inclui pelo menos <strong>três aspectos<\/strong>: (1) <strong>diminuição da esperança da parusia<\/strong>; (2) <strong>interesse pela igreja como instituição<\/strong>; (3) <strong>uso de credos para resumir a fé<\/strong>. <strong>Nada disso se vê em Judas:<\/strong> (1) a esperança da parusia <strong>brilha fortemente<\/strong> (v. 6, 14, 21, 24); (2) <strong>nem a igreja nem seus oficiais<\/strong> recebem a mínima alusão, e Judas não apela a mestres oficiais contra os falsos mestres; (3) “a fé entregue uma vez por todas aos santos” (v. 3) não é um corpo de doutrinas controlado por autoridades, mas os <strong>elementos básicos do evangelho<\/strong>, o ensino cristão mais antigo. Judas insiste na verdade do evangelho que leva a vidas piedosas.", "fonte": ["j-3-0", "j-3-1", "j-3-2", "j-3-3", "p-2-1"], "destaque": true}, {"numero": 10, "topico": "judas_recentes", "enunciado": "Segundo Carson, Moo e Morris, como Judas tem sido visto nos estudos recentes? Comente a avaliação dos autores sobre essa visão.", "gabarito": "Judas é pouco estudado: é curto e não está no centro dos debates. <strong>Rowston<\/strong> o chama de “<strong>o livro mais negligenciado do NT<\/strong>”, e <strong>Bauckham<\/strong> diz que nenhum livro foi mais negligenciado do que <strong>Judas e 2 Pedro<\/strong>. Quem o examina tende a ver o autor como <strong>conservador demais<\/strong>, <strong>defensor dogmático das velhas tradições<\/strong> e <strong>adversário intolerante<\/strong> de quem diverge. Os autores dizem que essa <strong>não é uma apreciação equitativa<\/strong>: “<strong>há mais do que dogmatismo em Judas<\/strong>”. Ele não é exemplo de catolicismo primitivo (parusia viva, nenhuma alusão à instituição, a fé como elementos básicos do evangelho) e nada prova que combata um gnosticismo tardio.", "fonte": ["j-1-0", "j-1-1", "j-2-0", "j-2-1", "j-3-1"], "destaque": true}, {"numero": 11, "topico": "judas_recentes", "enunciado": "Alguns estudiosos dizem que Judas combate o gnosticismo e o veem como “um avivamento do pensamento apocalíptico”. Explique essa posição e a resposta de Carson, Moo e Morris.", "gabarito": "<strong>Posição:<\/strong> quem data Judas depois da era apostólica costuma dizer que ele combate algum gnosticismo. <strong>Rowston<\/strong>, citando a teoria de <strong>R. M. Grant<\/strong> (a profecia levou ao pensamento apocalíptico depois da guerra macabeia, e este ao gnosticismo depois da guerra judaica), vê em Judas “<strong>um avivamento do pensamento apocalíptico<\/strong>”, talvez para restabelecer um paulinismo autêntico contra o gnosticismo antinomista. <strong>Resposta:<\/strong> essa afirmação deve ser vista <strong>com suspeita<\/strong>: o gnosticismo pleno é uma série de sistemas do <strong>séc. 2 avançado<\/strong>; alguns ensinos existiam no séc. 1, mas é exagero chamá-los de gnosticismo. <strong>Nada em Judas comprova<\/strong> que foi escrito quando o gnosticismo florescia. E o pensamento apocalíptico de Judas, presente também em <strong>Paulo e no Apocalipse<\/strong>, pode ser o <strong>pensamento apocalíptico normal dos primeiros cristãos<\/strong>.", "fonte": ["j-4-0", "j-4-1", "j-4-2"], "destaque": true}, {"numero": 12, "topico": "judas_recentes", "enunciado": "Segundo Carson, Moo e Morris, qual é o significado de “a fé que uma vez por todas foi entregue aos santos” (Jd 3) no debate sobre o “catolicismo primitivo”?", "gabarito": "Quem vê Judas como católico primitivo lê a expressão como um <strong>conjunto de ensinos oficiais<\/strong> que exigiria a rejeição dos que divergissem, sob controle das autoridades da igreja. Para os autores, não é isso: a expressão chama a atenção para os <strong>“elementos básicos” intimamente ligados ao evangelho<\/strong>; Judas fala da importância de ser <strong>fiel ao ensino cristão mais antigo<\/strong>, e não a um corpo de doutrinas sob controle eclesiástico. Ele <strong>não trata a igreja como guardiã<\/strong> do ensino legítimo contra os hereges, mas insiste na <strong>verdade do evangelho que leva a vidas piedosas<\/strong>, em contraste com a vida dos adversários.", "fonte": ["j-3-3", "j-3-2"], "destaque": true}, {"numero": 13, "topico": "judas_recentes", "enunciado": "Resuma o que Carson, Moo e Morris dizem sobre Judas nos estudos recentes (p. 512-513), apontando pelo menos dois temas do debate e a posição dos autores.", "gabarito": "1) <strong>Negligência:<\/strong> Rowston chama Judas de o livro mais negligenciado do NT; Bauckham inclui 2 Pedro. 2) <strong>Imagem dogmática:<\/strong> o autor é visto como defensor dogmático e intolerante; para Carson, há mais do que dogmatismo em Judas. 3) <strong>Catolicismo primitivo<\/strong> (menos esperança da parusia, igreja como instituição, credos): nada disso se vê em Judas, pois a parusia brilha (v. 6, 14, 21, 24), não há alusão à igreja ou a oficiais, e a fé “entregue uma vez por todas” são os elementos básicos do evangelho. 4) <strong>Gnosticismo:<\/strong> deve ser visto com suspeita, pois o gnosticismo pleno é do séc. 2, e o pensamento apocalíptico de Judas é o normal dos primeiros cristãos. (Basta desenvolver bem dois.)", "fonte": ["j-1-0", "j-2-1", "j-3-1", "j-3-2", "j-4-1", "j-4-2"], "destaque": true}, {"numero": 14, "topico": "tg_presbiteros", "enunciado": "Como o artigo “Tiago 5.13-18: uma análise exegética” interpreta a figura dos presbíteros em Tg 5.14 e o motivo de serem chamados?", "gabarito": "O presbítero (ancião) é o <strong>responsável pela igreja local<\/strong> (Vouga); Moo o aproxima do <strong>pastor moderno<\/strong> (At 20.28); Brown fala de uma <strong>função de autoridade associada aos apóstolos<\/strong>. O termo <strong>não se refere à idade avançada<\/strong>, mas a uma posição de autoridade. São chamados <strong>não por um dom especial de cura<\/strong>, mas por <strong>representarem a igreja<\/strong>, que mostra solidariedade ao doente. A iniciativa de chamá-los é do enfermo (imperativo de <em>proskalesasthō<\/em>).", "fonte": ["t-6-0", "t-6-1", "t-6-2", "t-6-3"], "destaque": false}, {"numero": 15, "topico": "tg_oracao", "enunciado": "Como o artigo interpreta a relação entre oração, unção com óleo e cura em Tg 5.14-15?", "gabarito": "A <strong>ênfase está na oração, e não no óleo<\/strong> (Kistemaker): não há imposição de mãos nem busca de alguém com dom de cura. A unção é <strong>ato físico com significado simbólico<\/strong> (Moo: <em>aleiphō<\/em>), separando o doente para a atenção de Deus; “em nome do Senhor” mostra conotação espiritual, contra o uso medicinal. A oração da fé “curará” (<em>sózō<\/em>, aqui no sentido de <strong>restaurar a saúde<\/strong>), e <strong>é o Senhor quem levanta o doente<\/strong> em resposta à oração. O “se” mostra que nem toda doença vem do pecado.", "fonte": ["t-7-3", "t-7-4", "t-8-0", "t-8-2", "t-8-3", "t-8-4"], "destaque": false}, {"numero": 16, "topico": "tg_estrutura", "enunciado": "Descreva o estilo e a organização temática da carta de Tiago segundo o artigo de Carreiro.", "gabarito": "Tiago não tem início epistolar nem organização sistemática: Konnings e Carson a veem como <strong>coleção de homilias<\/strong>. Mesmo assim, Carson discerne <strong>5 seções<\/strong> (1.1-18; 1.19–2.26; 3.1–4.12; 4.13–5.11; 5.12-20). O estilo tem <strong>63 hapax legomena<\/strong> e usa <strong>palavras-gancho<\/strong>, o que dificulta a delimitação. A perícope 5.13-18 está nas exortações finais, entre os juramentos (5.12) e a conversão dos desviados (5.19-20), e seu tema principal é a <strong>oração<\/strong> (sete ocorrências).", "fonte": ["t-3-0", "t-3-1", "t-3-2", "t-4-0", "t-4-1"], "destaque": false}, {"numero": 17, "topico": "pe1_recentes", "enunciado": "Explique a hipótese de que 1 Pedro seria uma homilia ou liturgia batismal e as críticas de Carson, Moo e Morris.", "gabarito": "<strong>Hipótese:<\/strong> Perdelwitz (1911) viu uma pausa em 4.11 e tomou a primeira parte como <strong>homilia batismal<\/strong>; Preisker, como a <strong>liturgia batismal de Roma<\/strong> (batismo depois de 1.21); Cross, como liturgia de batismo na <strong>Páscoa<\/strong>. <strong>Críticas:<\/strong> o batismo aparece <strong>só uma vez<\/strong> (3.21); o argumento dos tempos verbais falha (1.3 já está no passado); a variedade da carta é ignorada; <strong>não há evidência de liturgia fixa<\/strong> tão cedo; e não se explica por que uma liturgia romana iria para a Ásia Menor.", "fonte": ["a-2-0", "a-2-1", "a-2-2"], "destaque": false}, {"numero": 18, "topico": "contribuicao", "enunciado": "Qual é a contribuição da carta de Judas, segundo Carson, Moo e Morris?", "gabarito": "Judas se interessa pela salvação comum e pela <strong>fé entregue uma vez por todas aos santos<\/strong>, mas <strong>não faz apresentação sistemática<\/strong> nem refuta a heresia ponto por ponto: chama os leitores a ver o que acontece quando quem professa a Cristo <strong>nega a fé no ensino e na vida<\/strong>, e afirma que o <strong>juízo é certo<\/strong>. Mostra que <strong>não há nada de novo<\/strong> no erro (Egito, anjos, Sodoma; Caim, Balaão, Coré) e que os apóstolos já tinham advertido. Para hoje: a tolerância é importante, mas <strong>há limites<\/strong>; o evangelho pode ser remodelado a ponto de perder sua essência.", "fonte": ["j-5-0", "j-5-1", "j-5-2", "j-5-3"], "destaque": false}, {"numero": 19, "topico": "pe2_judas", "enunciado": "Qual é a relação entre 2 Pedro e Judas, segundo Carson, Moo e Morris?", "gabarito": "<strong>19 dos 25 versículos<\/strong> de Judas estão representados em 2 Pedro, mas as palavras raramente são idênticas. Guthrie: <strong>297 palavras em 2 Pedro, 256 em Judas, 78 comuns<\/strong>; se 2 Pedro copiou, alterou cerca de 70%. Das 12 seções paralelas, Judas é mais longo em cinco: nenhum é sempre mais conciso. Por isso a direção da dependência <strong>não está comprovada<\/strong>, o que enfraquece a objeção à autoria petrina baseada no uso de Judas.", "fonte": ["b-10-0", "b-10-1", "b-7-1"], "destaque": false}];
const MATERIA = [{"numero": 1, "rotulo": "Guia da prova", "titulo": "O que o professor quer na prova", "fonte": "Orientações do professor sobre a AV2, transcritas da aula. Os complementos estão marcados.", "secoes": [{"subtitulo": "Estrutura da prova", "paragrafos": ["A avaliação tem <strong>7 questões de múltipla escolha<\/strong> e <strong>2 discursivas<\/strong>. O professor já disse quais são os <strong>dois temas das discursivas<\/strong>: autoria de 2 Pedro e Judas em estudos recentes.", "As objetivas são “bem tranquilas”: <strong>três saem do artigo sobre Tiago 5.13-18<\/strong> e as demais são extraídas de pontos do material do Carson (1 Pedro, 2 Pedro e Judas)."], "paragrafoIds": ["p-0-0", "p-0-1"]}, {"subtitulo": "Discursiva 1 — Autoria de 2 Pedro", "paragrafos": ["Ele vai perguntar sobre a <strong>autoria de 2 Pedro<\/strong> e a defesa da <strong>autoria tradicional<\/strong> (Pedro como autor). Você precisa <strong>explicar os argumentos a favor da posição tradicional<\/strong>.", "Lembre-se de como o texto está organizado: o autor <strong>apresenta as objeções<\/strong> à autoria petrina e depois <strong>as refuta<\/strong>. O que ele quer é o <strong>tema da refutação<\/strong>: <strong>você escolhe uma das objeções<\/strong> e explica como ela é respondida. Não precisa explicar todas.", "<em>Complemento (Carson, p. 480-484):<\/em> as objeções respondidas são (1) diferença de <strong>estilo e vocabulário<\/strong> em relação a 1 Pedro; (2) <strong>Paulo e as “demais Escrituras”<\/strong> (3.15-16); (3) <strong>“os pais”<\/strong> (3.4); (4) o <strong>emprego de Judas<\/strong>; (5) o <strong>ensino falso<\/strong> (gnosticismo); (6) o <strong>motivo<\/strong> de uma pseudepígrafe. Somam-se a isso a confirmação externa, as alusões a Pedro na carta e a tradição da igreja.", "<strong>Modelo de resposta curta (objeção do uso de Judas):<\/strong> <em>“Objeta-se que um apóstolo não usaria o escrito de alguém que não era apóstolo, e que 2 Pedro usa Judas. Mas a objeção depende de duas pressuposições: primeiro, que Judas é a fonte de 2 Pedro, o que não está comprovado (alguns veem a dependência no sentido inverso); segundo, que um apóstolo não usaria um escrito não apostólico, o que não temos condições de afirmar. Não há motivo para dizer que Pedro não incorporaria palavras úteis, não importando onde as encontrasse.”<\/em>"], "paragrafoIds": ["p-1-0", "p-1-1", "p-1-2", "p-1-3"]}, {"subtitulo": "Discursiva 2 — Judas em estudos recentes (p. 512-513)", "paragrafos": ["A segunda discursiva sai da seção <strong>“Judas em estudos recentes”<\/strong>, nas <strong>páginas 512 e 513<\/strong> do Carson. Ele vai extrair uma pergunta desse trecho.", "<em>Complemento:<\/em> os pontos principais do trecho são: Judas como <strong>o livro mais negligenciado do NT<\/strong> (Rowston; Bauckham); a visão de Judas como <strong>defensor dogmático e intolerante<\/strong> (“há mais do que dogmatismo em Judas”); o <strong>“catolicismo primitivo”<\/strong> e seus três aspectos, que não se veem em Judas; e a alegação de que Judas combate o <strong>gnosticismo<\/strong>."], "paragrafoIds": ["p-2-0", "p-2-1"]}, {"subtitulo": "Múltipla escolha — o artigo de Tiago 5.13-18", "paragrafos": ["<strong>Três questões objetivas<\/strong> saem do artigo do início do PDF (Carreiro). Elas não são sobre a autoria de Tiago, mas sobre:", "<strong>1. Estilo e organização temática:<\/strong> logo no início o autor fala do <strong>estilo grego<\/strong> da carta e da sua <strong>organização temática<\/strong> (coleção de homilias; as 5 seções de Carson; 63 hapax legomena; “palavras-gancho”) e de <strong>sobre o que a perícope trata<\/strong> (o tema principal é a oração).", "<strong>2. Os presbíteros (v. 14):<\/strong> como ele interpreta a expressão <strong>“presbíteros”/“anciãos”<\/strong>: os responsáveis pela igreja local, posição de autoridade, não pessoas idosas.", "<strong>3. Oração e cura:<\/strong> como ele interpreta o tema da <strong>oração e da cura<\/strong> no texto: a ênfase está na oração, não no óleo nem num dom de cura.", "O professor chamou o artigo de texto “leve”: é uma exegese no sentido de comentário (o autor reúne o que vários comentaristas dizem e chega a conclusões), não uma exegese completa."], "paragrafoIds": ["p-3-0", "p-3-1", "p-3-2", "p-3-3", "p-3-4"]}, {"subtitulo": "Múltipla escolha — os outros pontos do material", "paragrafos": ["<strong>Contribuição (alternativa que NÃO é):<\/strong> haverá uma questão em que você deve marcar a alternativa que <strong>não traz uma contribuição<\/strong> do texto (o professor citou o texto sobre a contribuição de Judas). Leia as contribuições para reconhecê-las e perceber quando uma alternativa é diferente do que o texto diz.", "<strong>1 Pedro em estudos recentes:<\/strong> pseudepigrafia, perseguições e a hipótese da homilia/liturgia batismal.", "<strong>Autoria de 2 Pedro também em múltipla escolha.<\/strong> Dica do professor: o fato de haver uma objetiva sobre o tema perto da discursiva <strong>não significa que ela te dá a resposta da discursiva<\/strong>. Pense com cuidado no que cada uma pede."], "paragrafoIds": ["p-4-0", "p-4-1", "p-4-2"]}]}, {"numero": 2, "rotulo": "Artigo · Carreiro (2021)", "titulo": "Tiago 5.13-18: uma análise exegética", "fonte": "CARREIRO, Gustavo Albernaz Dias. Tiago 5.13-18: uma análise exegética. Revista Batista Pioneira, v. 10, n. 1, jun. 2021, p. 151-166.", "secoes": [{"subtitulo": "Resumo e objetivo", "paragrafos": ["O trabalho apresenta uma <strong>análise exegética histórico-gramatical<\/strong> de Tg 5.13-18: o método, as principais características da carta, a delimitação do texto e a exegese da perícope; por fim, uma <strong>síntese<\/strong> com a mensagem para o leitor contemporâneo.", "Os versículos falam de temas como a <strong>unção com óleo<\/strong> e a <strong>confissão de pecados<\/strong>, mas <strong>o principal assunto e foco é a oração<\/strong>."], "paragrafoIds": ["t-0-0", "t-0-1"]}, {"subtitulo": "O método histórico-gramatical", "paragrafos": ["Segundo <strong>Kunz<\/strong>, o método busca o significado do texto a partir do que suas palavras expressam em seu <strong>sentido simples<\/strong>, com base no <strong>contexto histórico<\/strong> da escrita, segundo regras semânticas e gramaticais comuns a qualquer texto literário. <strong>Lopes<\/strong> acrescenta os pressupostos da <strong>inspiração, veracidade e unidade do cânon<\/strong>.", "Seus princípios já aparecem na <strong>Escola de Antioquia<\/strong> e foram retomados na <strong>Reforma<\/strong>: segundo Zuck, Lutero e Calvino diziam que a Escritura é intérprete de si mesma e <strong>rejeitavam a alegoria<\/strong>.", "<strong>Passos:<\/strong> (1) familiarização com o texto: delimitação, crítica textual (Nestle-Aland 28) e tradução (NVI); (2) contextos histórico, literário e cultural; (3) análises léxica, morfológica, estilística, sintática, literária e teológica; (4) <strong>síntese<\/strong>, que atualiza as verdades do texto para hoje. Por questões estilísticas, o autor <strong>inverte o primeiro e o segundo passos<\/strong>."], "paragrafoIds": ["t-1-0", "t-1-1", "t-1-2"]}, {"subtitulo": "A carta de Tiago: autor, data e destinatários", "paragrafos": ["Há pelo menos quatro Tiagos no NT (filho de Zebedeu, filho de Alfeu, pai de Judas e irmão de Jesus). Para <strong>Carson<\/strong>, o candidato óbvio é <strong>Tiago, irmão do Senhor<\/strong> (Gl 1.19), pela proeminência na igreja primitiva, e pela semelhança entre o grego da carta e o do discurso de Tiago em <strong>At 15.13-21<\/strong>.", "Se o autor é o irmão de Jesus, a carta foi escrita provavelmente em <strong>Jerusalém<\/strong>, em meados de <strong>40 d.C.<\/strong> (antes do Concílio de Jerusalém, 48/49 d.C.).", "Para <strong>Vouga<\/strong>, o endereço “às doze tribos da Diáspora” faz dela uma <strong>circular<\/strong>; por isso está entre as “epístolas gerais”. O público aparenta ser de <strong>cristãos judeus<\/strong>."], "paragrafoIds": ["t-2-0", "t-2-1", "t-2-2"]}, {"subtitulo": "Estilo e organização temática", "paragrafos": ["A carta não tem início “epistolar” nem <strong>organização sistemática<\/strong>. <strong>Konnings<\/strong> sugere que seja uma <strong>reunião de homilias<\/strong>; <strong>Carson<\/strong> também a vê como <strong>coleção de homilias<\/strong> sem estrutura sistemática aparente.", "Mesmo assim, Carson discerne <strong>5 seções gerais<\/strong>: Provações e maturidade cristã (1.1-18); O cristianismo verdadeiro e as obras (1.19–2.26); Cisões dentro da comunidade (3.1–4.12); Implicações de uma conduta cristã (4.13–5.11); <strong>Exortações finais (5.12-20)<\/strong>.", "Quanto ao estilo, a pequena carta tem <strong>63 hapax legomena<\/strong> (Vouga) e usa <strong>“palavras-gancho”<\/strong> para conectar os temas (Konnings), o que pode <strong>dificultar a delimitação<\/strong> de grandes trechos."], "paragrafoIds": ["t-3-0", "t-3-1", "t-3-2"]}, {"subtitulo": "Delimitação do texto (5.13-18)", "paragrafos": ["Nas considerações finais (5.12-20), três temas encerram a carta: <strong>juramentos (5.12)<\/strong>, <strong>oração (5.13-18)<\/strong> e <strong>conversão dos que se desviaram (5.19-20)<\/strong>.", "Tiago usa <strong>sete vezes<\/strong> a palavra “oração” em 5.13-18, o que mostra a ênfase da perícope. O tema já tinha sido introduzido em <strong>1.5-8<\/strong>.", "Movimento do texto: exortação à oração em todas as circunstâncias (v. 13-14); acolhida da oração por Deus (v. 15a); perdão e confissão de pecados (v. 15b-16); de novo a oração, com o <strong>exemplo de Elias<\/strong> (v. 17-18). Por isso Vouga delimita a perícope em 13-18."], "paragrafoIds": ["t-4-0", "t-4-1", "t-4-2"]}, {"subtitulo": "Versículo 13: sofrimento e alegria", "paragrafos": ["Quando há problemas, o cristão deve <strong>orar e não murmurar<\/strong>; e Deus muda as circunstâncias pela oração. Para Lopes, Tiago corrige um comportamento errado (murmuração ou impaciência) diante das adversidades.", "<em>Euthyméō<\/em> (sentir-se feliz), segundo Moo, não se refere a circunstâncias externas, mas à alegria do coração, em tempos maus ou bons. “Cante louvores” é um só verbo, <em>psaleto<\/em> (“brandir”, “torcer”), que passou a indicar o canto de salmos e depois qualquer cântico religioso.", "Com Bruce: o remédio para a alma na tribulação não é a murmuração, mas a <strong>oração<\/strong>; e na alegria, não a frivolidade, mas <strong>cantar louvores<\/strong>."], "paragrafoIds": ["t-5-0", "t-5-1", "t-5-2"]}, {"subtitulo": "Versículo 14: os presbíteros", "paragrafos": ["O verbo para o doente (<em>astheneō<\/em>) às vezes se refere a alguém <strong>à beira da morte<\/strong>: indica gravidade. <em>Proskalesasthō<\/em> está no <strong>imperativo médio aoristo<\/strong>: a <strong>iniciativa de chamar os presbíteros deve vir do enfermo<\/strong>.", "Segundo <strong>Vouga<\/strong>, o presbítero (ancião, <em>presbytérous<\/em>) é o <strong>responsável pela igreja local<\/strong>. <strong>Moo<\/strong> aproxima o presbítero do <strong>pastor moderno<\/strong>: “pastores” e “presbíteros” nunca aparecem juntos numa mesma passagem, e At 20.28 diz que os presbíteros de Éfeso deviam “pastorear”.", "<strong>Brown<\/strong>: na comunidade primitiva o presbítero tinha uma <strong>função de autoridade associada aos apóstolos<\/strong> e presidia igrejas missionárias. O termo <strong>não se refere a alguém de idade avançada<\/strong>, mas a uma <strong>posição de autoridade na igreja local<\/strong>.", "<strong>Vouga<\/strong> adverte: o presbítero é enviado <strong>não por ter um dom especial de cura<\/strong>, mas por <strong>representar a igreja<\/strong>, que mostra solidariedade ao irmão doente e se une em torno dele para orar."], "paragrafoIds": ["t-6-0", "t-6-1", "t-6-2", "t-6-3"]}, {"subtitulo": "Versículo 14: a unção com óleo", "paragrafos": ["Na Antiguidade o óleo tinha <strong>uso medicinal<\/strong> e servia para a unção de sacerdotes; não era exclusivo do cristianismo (judaísmo e cultura pagã). Bruce sugere que Tiago o recomenda para que os cristãos não recorram a práticas pagãs ou supersticiosas.", "Na Bíblia a unção tem vários sentidos: cura ou purificação (Is 1.6; Jr 8.22; Mc 6.13); honra e alegria (Dt 28.40; Am 6.6; Lc 7.36-50); eleição ou consagração de sacerdotes e reis (1Sm 10.1; Êx 28.41).", "Interpretações: uso <strong>medicinal<\/strong> (oração + a melhor medicina disponível); <strong>símbolo do Espírito Santo<\/strong>; ou forma de <strong>encorajar a fé<\/strong> do doente (Taylor).", "<strong>Moo<\/strong>: Tiago usa <em>aleiphō<\/em>, e não <em>chríō<\/em>, porque <em>aleiphō<\/em> descreve o <strong>ato físico de ungir<\/strong> (no NT, <em>chríō<\/em> nunca se refere à unção física). Mas, como na LXX <em>aleiphō<\/em> também se aplica à consagração de sacerdotes, a unção é <strong>um ato físico com significado simbólico<\/strong>: os presbíteros <strong>separam o doente para receber atenção especial de Deus<\/strong>.", "“<strong>Em nome do Senhor<\/strong>” dá à unção conotação espiritual e é mais uma evidência <strong>contra o uso do óleo como remédio<\/strong>. Brown: não era apenas terapêutica, mas símbolo dos poderes terapêuticos de Cristo (Mc 6.13)."], "paragrafoIds": ["t-7-0", "t-7-1", "t-7-2", "t-7-3", "t-7-4"]}, {"subtitulo": "Versículo 15: a oração da fé e a cura", "paragrafos": ["Alguns veem aqui o exercício do <strong>dom de cura<\/strong>, mas <strong>não há imposição de mãos<\/strong> nem busca por alguém com esse dom (nem todos os presbíteros o teriam; em 1Co 12 os dons aparecem distintos). Tiago enfatiza a <strong>eficácia da oração<\/strong>. Kistemaker: “<strong>a ênfase está na oração, e não no óleo<\/strong>”.", "A oração é caracterizada pela <strong>fé<\/strong>: certeza de que Deus ouvirá e responderá (Lopes). Moo define a fé como “um compromisso inabalável e sincero com Deus”.", "“Curará” traduz <em>sózō<\/em>, que em Tiago (1.21; 2.14; 4.12; 5.20) tem sentido <strong>escatológico e soteriológico<\/strong>; Vouga sugere que a oração visaria a salvação. Mas isso fugiria da lógica do texto: aqui <strong>a ênfase recai sobre a cura do doente<\/strong>. Champlin: <em>sózō<\/em> com frequência significava “<strong>restaurar a saúde<\/strong>” (Mt 9.21; Mc 6.56).", "“O Senhor o levantará” é forma comum de indicar a <strong>recuperação de um enfermo<\/strong> (Mt 9.5; Mc 1.31). “Não é o azeite que cura o doente, mas antes <strong>o Senhor é que o levanta em resposta da oração da fé<\/strong>” (Harrison).", "“Se houver cometido pecados, será perdoado”: a literatura hebraica e os Evangelhos (Mc 2.3-12; Jo 5.14) associam doença e pecado. Mas o <strong>“se”<\/strong> mostra que Tiago <strong>não relaciona toda doença ao pecado<\/strong>. O presbítero não deve presumir pecado, nem excluir a possibilidade: age como pastor de almas, sondando a consciência e oferecendo o perdão de Deus, além de orar pela cura."], "paragrafoIds": ["t-8-0", "t-8-1", "t-8-2", "t-8-3", "t-8-4"]}, {"subtitulo": "Versículo 16: confissão mútua", "paragrafos": ["Não há consenso sobre <strong>como<\/strong> confessar. Alguns (Taylor): confissão específica, do doente a quem ora por ele. <strong>Lopes<\/strong>: pública e aberta, como a dos batizados por João (Mt 3.6). <strong>Harrison<\/strong>: nem confissões públicas indiscriminadas nem particulares, mas <strong>com o objetivo de que os crentes orem uns pelos outros<\/strong>.", "Sobre “uns aos outros”: Lopes e Bruce entendem que a prática se estende a <strong>todos os cristãos<\/strong>, mesmo sem o presbítero. <strong>Kistemaker<\/strong> equilibra: confissão pessoal num círculo de crentes; pecados que envolvem toda a igreja são confessados publicamente; os particulares, só com os envolvidos. Discernimento e restrição.", "“Para serem curados”, sem especificar se cura física ou espiritual. Champlin: nos rabinos, o enfermo confessava os pecados para facilitar a cura.", "“A oração de um justo é poderosa e eficaz”: para Champlin, só a de um <strong>ancião justo<\/strong>; para <strong>Keener<\/strong>, Tiago é mais ousado: na sabedoria judaica só mestres muito piedosos oravam por cura, e Tiago <strong>estende a oração com fé a todos os cristãos<\/strong>."], "paragrafoIds": ["t-9-0", "t-9-1", "t-9-2", "t-9-3"]}, {"subtitulo": "Versículos 17-18: Elias", "paragrafos": ["Tiago usa personagens do AT como exemplos: Abraão e Raabe (fé, 2.21-25), Jó (paciência, 5.11) e <strong>Elias, modelo de oração eficaz<\/strong>. Kistemaker: Elias era tido em alta estima no séc. 1 e recebia crédito por atributos sobre-humanos.", "“Orou fervorosamente” traduz <em>proseuchē prosēuxato<\/em>, literalmente “<strong>orou em oração<\/strong>”, recurso que indica a <strong>intensidade<\/strong> da oração.", "A oração de Elias <strong>não é mencionada no AT<\/strong>: Tiago teria usado fontes orais ou literárias (Eclesiástico 48.2-3; 2 Esdras 7.109).", "A lição: Elias era <strong>um homem como qualquer um<\/strong>, e os recursos disponíveis para ele estão para cada cristão. “As promessas de Deus quanto à oração [...] se estendem a todos os filhos de Deus” (Lopes)."], "paragrafoIds": ["t-10-0", "t-10-1", "t-10-2", "t-10-3"]}, {"subtitulo": "Considerações finais (síntese)", "paragrafos": ["Diante do sofrimento o crente deve orar; na boa fase, lembrar-se do Senhor. O líder da igreja tem um papel junto aos enfermos.", "A unção com óleo é <strong>símbolo espiritual de cura divina<\/strong>, de uso legítimo hoje se balizado pelas Escrituras. O texto não a desautoriza como ato simbólico, mas <strong>nada nele autoriza a unção pública em cultos por iniciativa do pastor<\/strong>.", "O principal assunto é a <strong>oração<\/strong>: eficaz se feita com fé; a igreja tem <strong>função terapêutica<\/strong> quando há confissão mútua de pecados. Como Elias, cada cristão é apenas humano: <strong>o poder não está na pessoa, mas naquele que ouve a oração<\/strong>."], "paragrafoIds": ["t-11-0", "t-11-1", "t-11-2"]}]}, {"numero": 3, "rotulo": "Carson, Moo & Morris", "titulo": "1 Pedro — Cânon, estudos recentes e contribuição", "fonte": "CARSON, D. A.; MOO, D. J.; MORRIS, L. Introdução ao Novo Testamento. São Paulo: Vida Nova, 1997, p. 473-476.", "secoes": [{"subtitulo": "Aceitação na igreja (p. 473)", "paragrafos": ["Há ecos de 1 Pedro em Barnabé, <strong>Policarpo<\/strong> (citações sem dúvida), Hermas e outros. O primeiro a citá-la explicitamente como escrito de Pedro é <strong>Ireneu<\/strong>. Depois disso é rotineiramente aceita, exceto pela exclusão (com todas as epístolas gerais) do <strong>Cânon Siríaco<\/strong>.", "Não está no <strong>Cânon Muratoriano<\/strong>, mas Selwyn e outros (Westcott) acham que o texto desse fragmento está incompleto. <strong>Eusébio<\/strong> a inclui entre os escritos autênticos. A igreja jamais pôs seriamente em dúvida sua autenticidade."], "paragrafoIds": ["a-0-0", "a-0-1"]}, {"subtitulo": "Autoria e perseguição (p. 473-474)", "paragrafos": ["Parte do debate se concentra na autoria, com <strong>tendência a considerar a carta pseudepígrafe<\/strong>. Mas ninguém apresenta motivo convincente para alguém escrever em nome de Pedro: a carta tem <strong>ensinos ortodoxos<\/strong>, nada que exigisse autorização oficial, e não se vê por que inventar que Pedro escreveu às igrejas daquelas províncias.", "A única consideração com algum peso: as <strong>perseguições<\/strong> não poderiam ter ocorrido na vida de Pedro, e o sofrimento “<strong>pelo nome de Cristo<\/strong>” ou “<strong>como cristão<\/strong>” (4.14,16) indicaria o tempo de <strong>Domiciano ou Trajano<\/strong>.", "Resposta: não há evidência de <strong>perseguição generalizada<\/strong> sob esses imperadores, e 1 Pedro não corresponde ao que se sabe delas: <strong>Plínio<\/strong> fala a Trajano de investigações oficiais e torturas, e nada disso aparece em 1 Pedro. Havia <strong>suspeita generalizada<\/strong> contra os cristãos desde muito antes, e autoridades locais podiam oprimi-los sem risco.", "Pedro conclama os leitores a partilharem dos <strong>sofrimentos<\/strong> de Cristo (4.13), mas não de sua morte: na carta <strong>não se vê uma devoção de mártir<\/strong>."], "paragrafoIds": ["a-1-0", "a-1-1", "a-1-2", "a-1-3"]}, {"subtitulo": "A hipótese batismal (p. 474-475)", "paragrafos": ["Alguns ligam a carta ao <strong>batismo<\/strong>, como <strong>homilia ou liturgia batismal<\/strong>. Em 1911, <strong>R. Perdelwitz<\/strong> viu uma pausa em <strong>4.11<\/strong>: antes, o sofrimento seria potencial; depois (4.12), concreto; a alegria é presente em 1.6,8 e futura em 4.12ss; e “resumidamente” (5.12) só se aplicaria ao trecho a partir de 4.12. A primeira parte seria uma <strong>homilia batismal<\/strong> (Wikenhauser: teoria “brilhante mas sem base sólida”).", "<strong>H. Preisker<\/strong>: essa parte seria a própria <strong>liturgia batismal da igreja em Roma<\/strong>, com o batismo acontecendo depois de 1.21 (não mencionado por segredo). <strong>F. L. Cross<\/strong>: liturgia do batismo realizado na <strong>Páscoa<\/strong>.", "Críticas de Carson: (1) o batismo é mencionado <strong>uma única vez<\/strong> (3.21), estranho se fosse o núcleo; (2) o argumento dos tempos verbais falha, pois já em 1.3 “nos regenerou” está no passado, e o particípio presente de 1.5 (“guardados”) não é futuro; (3) ignora a variedade da parte inicial; (4) <strong>não há evidência de liturgia fixa<\/strong> num período tão remoto; (5) nem se explica por que uma liturgia romana seria enviada à <strong>Ásia Menor<\/strong>. Os adeptos acentuaram demais algumas evidências e deixaram de lado o que não se harmoniza. Kelly: teorias de “impressionante engenhosidade”."], "paragrafoIds": ["a-2-0", "a-2-1", "a-2-2"]}, {"subtitulo": "Liturgia, parênese e unidade (p. 475-476)", "paragrafos": ["É amplamente aceito que há <strong>expressões litúrgicas<\/strong> e talvez fragmentos de credos no NT, e 1 Pedro contribui com isso (1.3-12; 2.4-8, 21-25; 3.18-22 são citados com frequência), embora a identificação seja subjetiva. Há também <strong>parênese<\/strong> (ensino aos convertidos).", "Isso não significa que a carta seja uma reunião de documentos: <strong>teorias de divisão em seções não são amplamente aceitas<\/strong>, e os estudiosos em geral declaram a <strong>unidade da carta<\/strong>.", "Quanto ao “<strong>paulinismo<\/strong>” usado contra a autoria petrina: Paulo e Pedro incluem muito do <strong>ensino cristão comum<\/strong> da igreja; é perigoso afirmar que um usou o outro."], "paragrafoIds": ["a-3-0", "a-3-1", "a-3-2"]}, {"subtitulo": "A contribuição de 1 Pedro (p. 476)", "paragrafos": ["Martin: “provavelmente nenhum outro documento do NT é tão <strong>teológico<\/strong> quanto 1 Pedro”, no sentido estrito de <strong>ensino sobre Deus<\/strong>. A palavra “Deus” aparece <strong>39 vezes<\/strong> (uma a cada 43 palavras); só <strong>1 João<\/strong> (1/34) e <strong>Romanos<\/strong> (1/46) se comparam.", "Deus vive (1.23), sua vontade é feita (2.15; 3.17), conhece previamente os seus (1.2), sua Palavra permanece (1.25). É o <strong>Pai<\/strong> (1.2), <strong>santo<\/strong> (1.15), o <strong>juiz de todos<\/strong> (4.5), o <strong>Criador fiel<\/strong> (4.19), o “<strong>Deus de toda a graça<\/strong>” (5.10); “graça” aparece <strong>dez vezes<\/strong>. Por sua misericórdia temos novo nascimento e viva esperança (1.3).", "A igreja é o “povo de Deus” (2.10), a “casa de Deus” (4.17), o “rebanho de Deus” (5.2), e seus membros são “servos de Deus” (2.16)."], "paragrafoIds": ["a-4-0", "a-4-1", "a-4-2"]}]}, {"numero": 4, "rotulo": "Carson, Moo & Morris", "titulo": "2 Pedro — Conteúdo, autoria e relação com Judas", "fonte": "CARSON, D. A.; MOO, D. J.; MORRIS, L. Introdução ao Novo Testamento. São Paulo: Vida Nova, 1997, p. 479-484.", "secoes": [{"subtitulo": "Conteúdo (p. 479)", "paragrafos": ["Abertura (1.1-2); as dádivas de Cristo (1.3-4) e a exortação ao aprimoramento de qualidades cristãs (1.5-11). Pedro sabe que tem pouco tempo de vida (1.14) e quer que os leitores se lembrem da verdade depois de sua morte (1.15).", "A mensagem não são “fábulas engenhosamente inventadas”: ele ouviu a voz na <strong>transfiguração<\/strong> (1.16-18). As Escrituras são obra do Espírito nos profetas (1.19-21).", "Falsos profetas do passado e falsos mestres do futuro (2.1-3); Deus julgou anjos e ímpios, mas salvou o justo Ló (2.4-10); os falsos mestres são arrogantes e serão castigados (2.10-22).", "Lembra uma carta anterior (3.1); zombadores nos últimos dias (3.3-7); a vinda do Senhor é certa, na cronologia do Senhor (3.8-10); exortação à vida piedosa, novos céus e nova terra (3.11-13); referência ao que <strong>Paulo<\/strong> escreveu (3.14-18)."], "paragrafoIds": ["b-0-0", "b-0-1", "b-0-2", "b-0-3"]}, {"subtitulo": "Autoria: o estado da questão (p. 479-481)", "paragrafos": ["O <strong>estilo<\/strong> não se assemelha ao de 1 Pedro e a linguagem é bem diferente. <strong>Bauckham<\/strong>: 2 Pedro tem a <strong>maior proporção de hapax legomena do NT<\/strong>; das 57 palavras exclusivas, 32 não ocorrem na LXX. Para ele, 2 Pedro pertence ao âmbito do <strong>grego dos judeus helenistas<\/strong>.", "Defensores da autoria petrina: a diferença pode vir do uso de <strong>secretários diferentes<\/strong> (pouco se sabe da contribuição de um secretário); e um escrito antigo que traz o nome do autor deve ser aceito como dele, a menos que haja fortes evidências contrárias.", "Hoje a maioria acha que essas evidências existem. <strong>Kümmel<\/strong>: “Pedro não pode ter escrito esta epístola.” Razões: (1) a relação com <strong>Judas<\/strong>; (2) diferenças de <strong>estilo e vocabulário<\/strong> com 1 Pedro; (3) as cartas de <strong>Paulo como Escritura<\/strong> (3.15-16); (4) os apóstolos como pessoas do passado (3.2) e “<strong>os pais<\/strong>” já mortos (3.4). Há também os vários livros atribuídos a Pedro (Evangelho, Atos e Apocalipse de Pedro): 2 Pedro seria mais um.", "Em geral, conservadores sustentam a autoria petrina; os demais, não. <strong>Bauckham<\/strong>, apesar de conservador, aceita a <strong>pseudonímia<\/strong>, mas como “<strong>ficção totalmente transparente<\/strong>”, sem intenção de enganar. Objeção de Carson: na igreja primitiva o debate sobre aceitar a carta girava justamente em torno de ela ser ou não de um apóstolo. Se a ficção era transparente, <strong>por que tantos não perceberam?<\/strong>"], "paragrafoIds": ["b-1-0", "b-1-1", "b-1-2", "b-1-3"]}, {"subtitulo": "Confirmação externa (p. 481)", "paragrafos": ["Green (com Westcott): nenhum livro do NT é tão mal atestado como 2 Pedro, mas ela tem “um apoio <strong>incomparavelmente melhor do que o melhor dos livros rejeitados<\/strong>”.", "Quem rejeita a autoria ressalta a fragilidade da atestação; quem aceita lembra que nenhum livro não canônico tem tanta aceitação e que, pela <strong>brevidade e pelo conteúdo<\/strong>, seria improvável que fosse muito citada."], "paragrafoIds": ["b-2-0", "b-2-1"]}, {"subtitulo": "Alusões a Pedro (p. 481-482)", "paragrafos": ["O autor se identifica como “<strong>Simeão Pedro<\/strong>, servo e apóstolo de Jesus Cristo” (1.1). A forma “Simeão” quase não é usada para Pedro (no NT só em At 15.14; não nos pais apostólicos nem na literatura pseudepígrafa). Seria natural para o próprio Pedro usar a forma original do nome; um <strong>imitador usaria a forma de 1 Pedro<\/strong>.", "Diz que o Senhor lhe mostrou que sua morte estava próxima (1.14); foi <strong>testemunha ocular da transfiguração<\/strong> (1.16-18); escreveu uma carta anterior aos mesmos leitores (3.1); chama Paulo de “<strong>nosso amado irmão<\/strong>” (3.15).", "Se é improvável que um apóstolo cite a transfiguração em vez da ressurreição, é igualmente improvável que um pseudônimo o faça. A transfiguração deve ter sido um ponto alto para Pedro, e há diferenças em relação aos evangelhos (sem Moisés e Elias, sem “a ele ouvi”, com o enfático <em>egō<\/em>)."], "paragrafoIds": ["b-3-0", "b-3-1", "b-3-2"]}, {"subtitulo": "Tradição da igreja (p. 482)", "paragrafos": ["A tradição atribui <strong>uniformemente<\/strong> a carta a Pedro; <strong>nenhum outro nome<\/strong> está vinculado a ela."], "paragrafoIds": ["b-4-0"]}, {"subtitulo": "Objeção: Paulo e as “demais Escrituras” (p. 482)", "paragrafos": ["<strong>Objeção:<\/strong> a referência às cartas de Paulo (3.15-16) pressupõe uma <strong>coleção oficial<\/strong> das epístolas paulinas, improvável na vida de Pedro.", "<strong>Resposta:<\/strong> 2 Pedro <strong>nada fala de coleção<\/strong>; “todas as suas epístolas” pode ser só as cartas de Paulo <strong>conhecidas por Pedro<\/strong>. E a carta revela pouco conhecimento das doutrinas paulinas, sinal de que ainda não havia coleção oficial.", "O problema principal é chamar as cartas de Paulo de “<strong>Escrituras<\/strong>” (<em>graphas<\/em>). Paulo já acreditava que seus escritos eram inspirados (1Co 7.40; 14.37) e autorizados (1Co 2.16; 14.37-38; 2Ts 3.14). A alegação de que houve um período em que Paulo foi negligenciado <strong>não tem evidências<\/strong>; nada impede que Pedro fosse <strong>o primeiro a reconhecer a mão de Deus<\/strong> no que Paulo escreveu.", "A favor de Pedro: o humilde reconhecimento de que achava os escritos de Paulo “<strong>difíceis de entender<\/strong>”. Quem escrevesse em nome de Pedro iria criar dúvidas sobre a capacidade do apóstolo de entender Paulo?"], "paragrafoIds": ["b-5-0", "b-5-1", "b-5-2", "b-5-3"]}, {"subtitulo": "Objeção: “os pais” (p. 483)", "paragrafos": ["<strong>Objeção:<\/strong> Pedro morreu cedo demais para chamar os primeiros líderes da igreja de “<strong>os pais<\/strong>” (3.4). (A tradução “nossos pais” se baseia em manuscritos inferiores.)", "<strong>Resposta:<\/strong> em <strong>nenhum outro versículo do NT<\/strong> “os pais” designa os primeiros cristãos; é muito mais provável que se refira aos <strong>patriarcas judeus<\/strong>. Nem é provável que um pseudônimo supusesse esse uso nos dias de Pedro. E a expressão é posta na boca dos <strong>falsos mestres<\/strong>, não usada pelo autor para si. <strong>A objeção não é decisiva.<\/strong>"], "paragrafoIds": ["b-6-0", "b-6-1"]}, {"subtitulo": "Objeção: o emprego de Judas (p. 483)", "paragrafos": ["<strong>Objeção:<\/strong> um apóstolo não usaria o escrito de alguém que não era apóstolo; logo, o uso de Judas elimina Pedro como autor.", "<strong>Resposta:<\/strong> há <strong>duas pressuposições<\/strong>. (1) Que <strong>Judas é a fonte<\/strong> de 2 Pedro: possível, mas <strong>não comprovado<\/strong>; alguns veem a dependência no sentido inverso. (2) Que um apóstolo <strong>não utilizaria um escrito não apostólico<\/strong>: não temos condições de dizer o que um apóstolo usaria. Pedro poderia incorporar <strong>palavras úteis, não importando onde as encontrasse<\/strong>."], "paragrafoIds": ["b-7-0", "b-7-1"]}, {"subtitulo": "Objeção: o ensino falso (p. 483-484)", "paragrafos": ["<strong>Objeção:<\/strong> o autor combate ensinos <strong>gnósticos<\/strong>, que só surgiram bem depois de Pedro.", "<strong>Resposta:<\/strong> <strong>nenhum sistema gnóstico conhecido<\/strong> forma paralelo com 2 Pedro; dizer que o autor se opõe ao gnosticismo é ir além das evidências (Neyrey: “os oponentes não são gnósticos”). O gnosticismo do séc. 2 é um conjunto de sistemas ecléticos; alguns ensinos depois atraentes aos gnósticos remontam à era apostólica, mas isso não é o gnosticismo em si."], "paragrafoIds": ["b-8-0", "b-8-1"]}, {"subtitulo": "Objeção: o motivo (p. 484)", "paragrafos": ["Se fosse pseudepígrafe, <strong>por que foi escrita?<\/strong> Os escritos que usavam um grande nome do passado para ganhar respeitabilidade promoviam <strong>ensinos não ortodoxos<\/strong>. Não é o caso de 2 Pedro: seus ensinos são <strong>ortodoxos<\/strong>, em consonância com outros mestres, e poderia ser publicada com o nome do verdadeiro autor ou sem nome. Para escrever ortodoxia <strong>não era preciso apelar a um grande nome<\/strong>; ninguém apresentou motivo razoável.", "<strong>Conclusão de Carson:<\/strong> nem todos os problemas foram superados, e a investigação histórica se limita a probabilidades. Mas <strong>nenhum argumento conclusivo<\/strong> foi apresentado contra a autoria; as objeções não se sustentam, e é melhor aceitar a carta <strong>como escrito autêntico do apóstolo Pedro<\/strong>."], "paragrafoIds": ["b-9-0", "b-9-1"]}, {"subtitulo": "Relacionamento entre 2 Pedro e Judas (p. 484)", "paragrafos": ["<strong>19 dos 25 versículos de Judas<\/strong> estão representados em 2 Pedro, mas as palavras raramente são idênticas.", "Contagem de <strong>Guthrie<\/strong>: os trechos comuns têm <strong>297 palavras em 2 Pedro<\/strong> e <strong>256 em Judas<\/strong>, e só <strong>78 são comuns<\/strong>. Se 2 Pedro tomou emprestado, alterou cerca de <strong>70%<\/strong> das palavras de Judas; se Judas usou 2 Pedro, alterou um pouco mais e reduziu. Das <strong>12 seções paralelas<\/strong>, Judas é mais longo em cinco: nenhum dos dois é consistentemente mais conciso."], "paragrafoIds": ["b-10-0", "b-10-1"]}]}, {"numero": 5, "rotulo": "Carson, Moo & Morris", "titulo": "Judas — Estudos recentes e contribuição", "fonte": "CARSON, D. A.; MOO, D. J.; MORRIS, L. Introdução ao Novo Testamento. São Paulo: Vida Nova, 1997, p. 512-515.", "secoes": [{"subtitulo": "Cânon (p. 512)", "paragrafos": ["Judas foi classificado entre os livros <strong>contestados<\/strong>, mas conquistou espaço e foi aceito, exceto pelo <strong>Cânon Siríaco<\/strong> (que excluiu também as outras epístolas gerais e o Apocalipse).", "As dúvidas vinham do uso de <strong>livros apócrifos<\/strong> pelo autor: alguns achavam que nenhum escritor canônico faria isso. Com o tempo, viu-se que isso não era motivo suficiente, e a aceitação tornou-se universal."], "paragrafoIds": ["j-0-0", "j-0-1"]}, {"subtitulo": "Judas em estudos recentes: um livro negligenciado (p. 512)", "paragrafos": ["Judas não está no centro de grandes debates teológicos: é curto e seu tema não prende a atenção da vanguarda. <strong>Rowston<\/strong> o chama de “<strong>o livro mais negligenciado do Novo Testamento<\/strong>”.", "<strong>Bauckham<\/strong>: “Nenhum outro livro do NT tem sido mais negligenciado pelos estudiosos do que <strong>Judas e 2 Pedro<\/strong>”; as opiniões costumeiras vêm de uma era passada, e seu comentário tenta trazer o estudo para os anos 1980. Vez por outra os estudiosos tratam da relação óbvia entre Judas e 2 Pedro."], "paragrafoIds": ["j-1-0", "j-1-1"]}, {"subtitulo": "A imagem de Judas como dogmático (p. 512)", "paragrafos": ["Quem examina Judas em geral não se impressiona: vê o autor como <strong>preocupado demais em manter uma atitude conservadora<\/strong> diante do depósito da verdade, opondo-se energicamente ao que considera herético, um <strong>defensor dogmático das velhas tradições<\/strong> e <strong>adversário intolerante<\/strong> dos que divergem.", "Carson: dificilmente essa é uma apreciação equitativa. “<strong>Há mais do que dogmatismo em Judas.<\/strong>”"], "paragrafoIds": ["j-2-0", "j-2-1"]}, {"subtitulo": "Judas e o “catolicismo primitivo” (p. 512-513)", "paragrafos": ["Há amplo interesse no chamado “<strong>catolicismo primitivo<\/strong>”, e Judas é visto com frequência como exemplo dele. A expressão costuma ser <strong>pejorativa<\/strong> (o “católico primitivo” não seria cristianismo autêntico) e tem <strong>significado incerto<\/strong>.", "Consenso aproximado: inclui pelo menos <strong>três aspectos<\/strong>: (1) a <strong>diminuição da esperança da parusia<\/strong>; (2) o <strong>interesse pela igreja como instituição<\/strong>; (3) o <strong>emprego de credos para resumir a fé<\/strong>. <strong>Nada disso se vê em Judas.<\/strong>", "(1) A esperança da parusia <strong>brilha fortemente<\/strong> (v. 6, 14, 21, 24): não há diminuição da expectativa. (2) <strong>Nem a igreja nem seus oficiais<\/strong> recebem a mínima alusão: Judas poderia ter apelado aos mestres oficiais contra os falsos mestres, mas não o faz.", "(3) A “<strong>fé que uma vez por todas foi entregue aos santos<\/strong>” (v. 3) não é um corpo de doutrinas oficiais sob controle de autoridades eclesiásticas, mas os <strong>elementos básicos<\/strong> ligados ao evangelho: fidelidade ao ensino cristão mais antigo. Judas não trata a igreja como guardiã do ensino legítimo contra os hereges; insiste na <strong>verdade do evangelho que leva a vidas piedosas<\/strong>."], "paragrafoIds": ["j-3-0", "j-3-1", "j-3-2", "j-3-3"]}, {"subtitulo": "Judas e o gnosticismo (p. 513)", "paragrafos": ["Quem data Judas depois da era apostólica costuma dizer que ele combate algum <strong>gnosticismo<\/strong>. Rowston cita R. M. Grant (profecia → pensamento apocalíptico após a guerra macabeia → gnosticismo após a guerra judaica) e vê em Judas “<strong>um avivamento do pensamento apocalíptico<\/strong>”, talvez para restabelecer um paulinismo autêntico contra o gnosticismo antinomista.", "Carson: devemos ver <strong>com suspeita<\/strong> a ideia de gnosticismo por trás de um escrito do NT: o gnosticismo pleno é uma série de sistemas do <strong>séc. 2 avançado<\/strong>. Alguns ensinos isolados existiam no séc. 1, mas é exagero chamá-los de “gnosticismo”. <strong>Nada em Judas comprova<\/strong> que foi escrito quando o gnosticismo florescia.", "Há pensamento apocalíptico em Judas, mas também em <strong>Paulo e no Apocalipse<\/strong>: pode ser simplesmente o <strong>pensamento apocalíptico normal dos primeiros cristãos<\/strong>, não um “avivamento”."], "paragrafoIds": ["j-4-0", "j-4-1", "j-4-2"]}, {"subtitulo": "A contribuição de Judas (p. 514-515)", "paragrafos": ["Judas se interessa pela <strong>salvação comum<\/strong> e pela <strong>fé entregue uma vez por todas aos santos<\/strong> (3). Mas a carta <strong>não é uma apresentação sistemática da fé<\/strong>: ela chama os leitores a considerar o que acontece quando quem professa seguir a Cristo <strong>nega a fé no ensino e na vida<\/strong> (4).", "Ele <strong>não refuta a heresia ponto por ponto<\/strong>: basta que os leitores considerem o tipo de vida dos hereges. Enfatiza que o <strong>juízo divino é certo<\/strong>: quem vive como eles sofrerá castigo eterno. Childs: a carta dá “uma <strong>descrição teológica do fenômeno da heresia<\/strong>” em vez de atacar uma forma histórica específica de erro.", "<strong>Não há nada de novo<\/strong> nas atitudes erradas: os incrédulos libertos do Egito, os anjos pecadores, Sodoma e Gomorra (5-7); Caim, Balaão e Coré (11). Os apóstolos já haviam advertido que surgiriam hereges (17-19). Os leitores <strong>não deviam se surpreender, mas também não podiam ser complacentes<\/strong>: devem opor-se resolutamente aos ensinos e práticas que se dizem cristãos mas negam a essência da fé.", "<strong>Para hoje:<\/strong> a tolerância é importante; há variedade legítima de expressões do cristianismo, e não devemos nos pôr como juízes em questões menores. Mas <strong>existem limites<\/strong>: é possível remodelar o evangelho a ponto de ele <strong>perder sua essência<\/strong>, e reinterpretar a vida cristã até ela não se distinguir da do mundo. As advertências de Judas têm <strong>importância permanente<\/strong>."], "paragrafoIds": ["j-5-0", "j-5-1", "j-5-2", "j-5-3"]}]}, {"numero": 6, "rotulo": "Carson, Moo & Morris", "titulo": "Apocalipse — Conteúdo e estrutura (início)", "fonte": "CARSON, D. A.; MOO, D. J.; MORRIS, L. Introdução ao Novo Testamento. São Paulo: Vida Nova, 1997, p. 516 (última página do PDF; o professor não comentou este trecho).", "secoes": [{"subtitulo": "Estrutura de Apocalipse", "paragrafos": ["A estrutura é objeto de acirrados debates, porque as conclusões influenciam a compreensão dos referentes históricos e da escatologia. Há consenso de que <strong>1.1-20 (ou 1.1-8)<\/strong> é o prólogo, <strong>22.6-11<\/strong> o epílogo, e que as <strong>cartas às sete igrejas (caps. 2–3)<\/strong> são uma unidade à parte.", "Base possível em <strong>1.19<\/strong>: “as coisas que viste” (visão do cap. 1), “as que são” (cartas, caps. 2–3) e “as que hão de acontecer depois destas” (caps. 4ss).", "Para 4.1–22.5 há muitas propostas: três partes marcadas pelo convite “vem e vê”; duas metades (12–22 repetindo 1–11, Swete); uma peça em <strong>sete atos com sete cenas<\/strong> (Bowman); ou um <strong>quiasmo<\/strong> (Fiorenza)."], "paragrafoIds": ["r-0-0", "r-0-1", "r-0-2"]}]}];

function carregarProgresso() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function gravarProgresso() {
  try {
    progresso.__diss = dissRespostas;
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progresso));
  } catch (e) { /* armazenamento indisponível */ }
}

function ring(pct, size) {
  size = size || 34;
  const r = (size - 4) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>
    <span class="ring-label">${Math.round(pct)}%</span>
  </div>`;
}

function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ===== SIMULADOS =====
function getSim(key) {
  if (!key) return null;
  if (key[0] === 's' && !key.includes(':')) {
    const i = Number(key.slice(1));
    const s = SIMULADOS[i];
    if (!s) return null;
    return { titulo: 'Simulado ' + s.numero, eyebrow: `Simulado ${s.numero} de ${SIMULADOS.length} · formato da prova`, ids: s.ids, diss: s.diss, idx: i };
  }
  if (key.startsWith('topico:')) {
    const t = key.slice(7);
    if (!TOPICOS[t]) return null;
    return { titulo: TOPICOS[t], eyebrow: 'Treino por tópico', ids: QUESTOES.filter(q => q.topico === t).map(q => q.id), diss: [] };
  }
  if (key === 'aleatorio') {
    const salvo = progresso[key];
    const prova = salvo && salvo.ids ? { ids: salvo.ids.filter(id => QMAP[id]), diss: (salvo.diss || []).filter(n => DMAP[n]) } : sortearProva();
    return { titulo: 'Prova aleatória', eyebrow: '7 objetivas + 2 discursivas sorteadas', ids: prova.ids, diss: prova.diss };
  }
  return null;
}

function embaralhar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Sorteia uma prova no formato real: MOLDE de objetivas + 2 discursivas
// (uma sobre a autoria de 2 Pedro e outra sobre Judas em estudos recentes).
function sortearProva() {
  const usados = new Set();
  const ids = [];
  MOLDE.forEach(t => {
    const opcoes = embaralhar(QUESTOES.filter(q => (t === 'livre' ? TOPICOS_LIVRE.includes(q.topico) : q.topico === t) && !usados.has(q.id)));
    if (opcoes.length) { usados.add(opcoes[0].id); ids.push(opcoes[0].id); }
  });
  const destaque = DISSERTATIVAS.filter(d => d.destaque);
  const d1 = embaralhar(destaque.filter(d => d.topico === DISS_TOPICOS[0]))[0];
  const d2 = embaralhar(destaque.filter(d => d.topico === DISS_TOPICOS[1]))[0];
  return { ids: embaralhar(ids), diss: [d1, d2].filter(Boolean).map(d => d.numero) };
}

function salvarProgressoAtual() {
  if (view === 'simulado' && simKey) {
    const sim = getSim(simKey);
    progresso[simKey] = { respostas: { ...respostas }, corrigido, ids: sim ? sim.ids : undefined, diss: sim ? sim.diss : undefined };
    gravarProgresso();
  }
}

function startSim(key) {
  salvarProgressoAtual();
  view = 'simulado';
  simKey = String(key);
  returnTo = null;
  const salvo = progresso[simKey];
  if (salvo) {
    respostas = { ...(salvo.respostas || {}) };
    corrigido = !!salvo.corrigido;
  } else {
    respostas = {};
    corrigido = false;
    if (simKey === 'aleatorio') progresso.aleatorio = { respostas: {}, corrigido: false, ...sortearProva() };
  }
  renderSim();
  window.scrollTo({ top: 0 });
}

function novoAleatorio() {
  delete progresso.aleatorio;
  gravarProgresso();
  view = 'home';
  startSim('aleatorio');
}

function reiniciarSimulado() {
  if (!window.confirm('Isso vai apagar suas respostas deste simulado. Tem certeza que quer recomeçar do zero?')) return;
  const salvo = simKey === 'aleatorio' && progresso.aleatorio ? progresso.aleatorio : {};
  respostas = {};
  corrigido = false;
  progresso[simKey] = { respostas: {}, corrigido: false, ids: salvo.ids, diss: salvo.diss };
  gravarProgresso();
  renderSim();
}

function escolher(id, letra) {
  if (corrigido) return;
  respostas[id] = letra;
  salvarProgressoAtual();
  renderSim(true);
}

function setSimDiss(n, val) {
  respostas['d_' + n] = val;
  salvarProgressoAtual();
}

function corrigir() {
  corrigido = true;
  salvarProgressoAtual();
  renderSim();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function calcScore(sim, resp) {
  let ok = 0;
  sim.ids.forEach(id => { if (resp[id] && resp[id] === QMAP[id].correta) ok++; });
  return { ok, total: sim.ids.length };
}

function scorePorTopico(sim) {
  const out = {};
  sim.ids.forEach(id => {
    const q = QMAP[id];
    out[q.topico] = out[q.topico] || { ok: 0, total: 0 };
    out[q.topico].total++;
    if (respostas[id] === q.correta) out[q.topico].ok++;
  });
  return out;
}

  view = 'home';

    const p = progresso['s' + i];
    let extra = '';
    let cls = '';
    if (p && p.corrigido) {
      const sc = calcScore({ ids: s.ids }, p.respostas || {});
      extra = `<small>${sc.ok}/${sc.total}</small>`;
      cls = 'done';
    }
    return `<button class="sim-chip ${cls}" onclick="startSim('s${i}')">${s.numero}${extra}</button>`;
  }).join('');

  const topicos = Object.keys(TOPICOS).map(t => {
    const n = QUESTOES.filter(q => q.topico === t).length;

  document.getElementById('root').innerHTML = `
    <div class="home">
      <div class="home-inner">
        <span class="home-badge">FABAT · Epístolas Gerais</span>
        <h1 class="home-title">Simulados<br><span>AV2</span></h1>

        <div class="format-pills">
          <span class="pill">${QUESTOES.length} objetivas</span>
          <span class="pill">${DISSERTATIVAS.length} discursivas</span>
          <span class="pill">Comentário em cada questão</span>
        </div>
        <div class="home-nav">
          <button class="home-nav-btn primary" onclick="renderLicao(0)">🎯&nbsp;&nbsp;O que cai na prova</button>
          <button class="home-nav-btn secondary" onclick="startSim('aleatorio')">🎲&nbsp;&nbsp;Prova aleatória (7 + 2)</button>
          <button class="home-nav-btn secondary" onclick="renderDissertativas()">📝&nbsp;&nbsp;Questões Dissertativas</button>
          <button class="home-nav-btn secondary" onclick="renderMateriaIndex()">📖&nbsp;&nbsp;Material de Estudo</button>

        <div class="sim-grid" style="margin-bottom:1.8rem">${chips}</div>

        <div class="topico-list">${topicos}</div>
        <p class="footer-note">A prova sai do material da AV2: o artigo “Tiago 5.13-18: uma análise exegética” (Carreiro, <em>Revista Batista Pioneira</em>, 2021) e os capítulos de 1 Pedro, 2 Pedro e Judas de Carson, Moo &amp; Morris, <em>Introdução ao Novo Testamento</em>. Os simulados seguem as orientações do professor. Suas respostas ficam salvas só neste navegador.</p>
      </div>
    </div>`;
}

// ===== SIMULADO =====
function renderSim(keepScroll) {
  const sim = getSim(simKey);
  if (!sim) return renderHome();
  const y = window.scrollY;
  const answered = sim.ids.filter(id => respostas[id]).length;
  const total = sim.ids.length;
  const pct = total ? answered / total * 100 : 0;
  const isFixo = sim.idx !== undefined;

  let html = `<div class="topbar">
    <div class="topbar-left">
      ${!corrigido ? `<span id="progress-ring-container">${ring(pct, 30)}</span>` : `<div class="completed-badge">${ICON_CHECK}</div>`}
      <span class="topbar-title">${sim.titulo}</span>
    </div>
    <div class="topbar-right">
      ${isFixo ? `<select class="select-pill" onchange="startSim(this.value)">
        ${SIMULADOS.map((s, i) => `<option value="s${i}" ${i === sim.idx ? 'selected' : ''}>Simulado ${s.numero}</option>`).join('')}
      </select>` : ''}
      <button class="btn-pill" onclick="reiniciarSimulado()" title="Apagar respostas e recomeçar">${ICON_RESET} Reiniciar</button>
      <button class="btn-pill" onclick="renderHome()">Início</button>
    </div>
  </div>`;

  html += '<div class="wrap">';

  if (corrigido) {
    const sc = calcScore(sim, respostas);
    const porTopico = scorePorTopico(sim);
    html += `<div class="placar">
      <div class="placar-top">
        <div class="placar-icon">${ICON_CHECK}</div>
        <div>
          <div class="placar-titulo">Objetivas: ${sc.ok} de ${sc.total}</div>
          <div class="placar-sub">Leia o comentário de cada questão${sim.diss && sim.diss.length ? ' e confira as discursivas no fim da página' : ''}.</div>
        </div>
      </div>
      ${Object.keys(porTopico).map(t => {
        const r = porTopico[t];
        const p = Math.round(r.ok / r.total * 100);
        return `<div class="placar-row">
          <span class="placar-row-label">${TOPICOS[t]}</span>
          <div class="placar-bar-wrap"><div class="placar-bar bar-mult" style="width:${p}%"></div></div>
          <span class="placar-score">${r.ok}<small>/${r.total}</small></span>
        </div>`;
      }).join('')}
      <div class="placar-total">
        <span class="placar-total-label">Aproveitamento</span>
        <span class="placar-total-value">${Math.round(sc.ok / sc.total * 100)}%</span>
      </div>
    </div>`;
  } else {
    html += `<div class="page-head">
      <span class="page-eyebrow">${sim.eyebrow}</span>
      <h1 class="page-title">Múltipla escolha</h1>
      <p class="page-sub">${answered} de ${total} questões respondidas · marque uma alternativa por questão</p>
    </div>`;
  }

  sim.ids.forEach((id, n) => {
    const q = QMAP[id];
    const sel = respostas[id];
    let cardCls = '';
    if (corrigido) cardCls = sel === q.correta ? 'correct' : 'incorrect';
    html += `<div class="card ${cardCls}">
      <div class="q-head">
        <span class="q-num">${n + 1}</span>
        <div style="flex:1">
          <span class="q-tag">${TOPICOS[q.topico]}</span>
          <p class="q-enunciado">${q.enunciado}</p>
        </div>
      </div>
      <div class="alt-list">
        ${q.alternativas.map(alt => {
          let cls = sel === alt.letra ? 'sel' : '';
          let badge = '';
          if (corrigido) {
            if (alt.letra === q.correta && sel === alt.letra) { cls = 'acerto'; badge = `<span class="alt-badge" style="color:var(--green)">${ICON_CHECK}</span>`; }
            else if (alt.letra === q.correta) { cls = 'perdida'; badge = `<span class="alt-badge" style="color:var(--amber)">${ICON_ARROW}</span>`; }
            else if (sel === alt.letra) { cls = 'errada'; badge = `<span class="alt-badge" style="color:var(--red)">${ICON_X}</span>`; }
            else cls = '';
          }
          return `<button class="alt ${cls}" onclick="escolher('${q.id}','${alt.letra}')" ${corrigido ? 'style="cursor:default"' : ''}>
            <span class="alt-letra">${alt.letra}</span>
            <span class="alt-texto">${alt.texto}</span>
            ${badge}
          </button>`;
        }).join('')}
      </div>
      ${corrigido ? `<div class="coment-box">
        <span class="gab-label">${sel === q.correta ? 'Correto' : (sel ? 'Resposta certa: ' + q.correta : 'Não respondida · certa: ' + q.correta)}</span>${q.comentario}
        ${q.fonte && q.fonte.length ? `<br><button class="btn-fonte" onclick="showFonteModal('${q.fonte.join(',')}')">📖 Ver no material</button>` : ''}
      </div>` : ''}
    </div>`;
  });

  if (sim.diss && sim.diss.length) {
    html += `<div class="section-label">Discursivas <span class="count">${sim.diss.length}</span></div>
      <p class="section-hint">${corrigido ? 'Compare sua resposta com o gabarito.' : 'Escreva sua resposta. O gabarito aparece depois de corrigir.'}</p>`;
    sim.diss.forEach((num, k) => {
      const d = DMAP[num];
      const val = respostas['d_' + num] || '';
      html += `<div class="card">
        <div class="q-head">
          <span class="q-num">${total + k + 1}</span>
          <div style="flex:1">
            <span class="q-tag">${TOPICOS[d.topico]}</span>
            <p class="q-enunciado">${d.enunciado}</p>
          </div>
        </div>
        <textarea class="q-textarea" rows="4" placeholder="Sua resposta…" oninput="setSimDiss(${num}, this.value)">${escapeAttr(val)}</textarea>
        ${corrigido ? `<div class="gab-box visible">
          <span class="gab-label">Gabarito</span>${d.gabarito}
          ${d.fonte && d.fonte.length ? `<br><button class="btn-fonte" onclick="showFonteModal('${d.fonte.join(',')}')">📖 Ver no material</button>` : ''}
        </div>` : ''}
      </div>`;
    });
  }

  if (!corrigido) {
    html += `<div class="action-card">
      <p>${answered < total ? `Faltam ${total - answered} questões para concluir.` : 'Tudo respondido. Hora de corrigir!'}</p>
      <button class="btn-block btn-success" onclick="corrigir()">Corrigir simulado</button>
    </div>`;
  } else {
    let next = '';
    if (isFixo && sim.idx < SIMULADOS.length - 1) next = `<button class="btn-block btn-primary" onclick="startSim('s${sim.idx + 1}')">Próximo simulado →</button>`;
    if (simKey === 'aleatorio') next = `<button class="btn-block btn-primary" onclick="novoAleatorio()">🎲 Sortear outra prova</button>`;
    html += `<div class="action-card">
      <div class="action-row">
        ${next}
        <button class="btn-block btn-ghost" onclick="renderHome()">Voltar ao início</button>
      </div>
    </div>`;
  }

  html += '</div>';
  document.getElementById('root').innerHTML = html;
  if (keepScroll) window.scrollTo({ top: y });
}

  gravarProgresso();
}

function toggleGab(num) {
  const box = document.getElementById('gab_' + num);
  if (box) box.classList.toggle('visible');
}

  salvarProgressoAtual();
  view = 'dissertativas';
  returnTo = null;
  let html = `<div class="topbar">
    <div class="topbar-left"><span class="topbar-title">Questões Dissertativas</span></div>

  grupos.forEach(g => {

        </div>
      </div>`;
    });
  });

  html += '</div>';
  document.getElementById('root').innerHTML = html;
}

// ===== FONTE / MODAL =====
function findParagrafo(pid) {
  for (let li = 0; li < MATERIA.length; li++) {
    const licao = MATERIA[li];
    for (const secao of licao.secoes) {
      const idx = secao.paragrafoIds.indexOf(pid);
      if (idx !== -1) return { licaoIdx: li, licao, subtitulo: secao.subtitulo, texto: secao.paragrafos[idx] };
    }
  }
  return null;
}

function showFonteModal(idsStr) {
  closeFonteModal();
  const ids = idsStr.split(',');
  const trechos = ids.map(findParagrafo).filter(Boolean);
  if (!trechos.length) return;
  const partes = [...new Set(trechos.map(t => t.licao.rotulo + ' — ' + t.licao.titulo))];

  const container = document.createElement('div');
  container.id = 'fonte-modal-container';
  container.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeFonteModal()">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-header-text">Trecho do material de estudo</div>
          <div class="modal-header-sub">${partes.join(' · ')}</div>
        </div>
        <button class="modal-close" onclick="closeFonteModal()">✕</button>
      </div>
      <div class="modal-body">
        ${trechos.map(t => `<p class="modal-paragrafo"><strong style="color:var(--teal)">${t.subtitulo}</strong><br>${t.texto}</p>`).join('')}
      </div>
      <div class="modal-footer">
        <button class="modal-link-btn" onclick="goToFonteInMaterial('${idsStr}')">Abrir no material →</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(container);
}

function closeFonteModal() {
  const el = document.getElementById('fonte-modal-container');
  if (el) el.remove();
}

function goToFonteInMaterial(idsStr) {
  closeFonteModal();
  const ids = idsStr.split(',');
  const first = findParagrafo(ids[0]);
  if (!first) return;
  if (view === 'simulado') { salvarProgressoAtual(); returnTo = { view: 'simulado' }; }
  else if (view === 'dissertativas') returnTo = { view: 'dissertativas' };
  renderLicao(first.licaoIdx, ids);
  setTimeout(() => {
    const el = document.getElementById(ids[0]);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

function voltarParaOrigem() {
  if (!returnTo) return renderHome();
  const destino = returnTo;
  returnTo = null;
  if (destino.view === 'simulado') { view = 'simulado'; renderSim(); }
  else if (destino.view === 'dissertativas') renderDissertativas();
  else renderHome();
}

function renderLicao(idx, highlightIds) {
  view = 'licao';
  currentLicao = idx;

  let html = `<div class="topbar">
    <div class="topbar-left"><span class="topbar-title">${licao.titulo}</span></div>
    <div class="topbar-right">
      ${returnTo ? `<button class="btn-pill accent" onclick="voltarParaOrigem()">${ICON_ARROW_LEFT} Voltar à questão</button>` : ''}

      <button class="btn-pill" onclick="renderHome()">Início</button>
    </div>
  </div>`;

  html += '<div class="wrap">';
  html += '<div class="licao-nav">';
  MATERIA.forEach((l, i) => {
    html += `<button class="licao-nav-btn ${i === idx ? 'active' : ''}" onclick="renderLicao(${i})">${l.numero}. ${l.rotulo}</button>`;
  });
  html += '</div>';

  html += `<div class="page-head">
    <span class="page-eyebrow">Parte ${licao.numero} · ${licao.rotulo}</span>
    <h1 class="page-title">${licao.titulo}</h1>
    <p class="materia-fonte">${licao.fonte}</p>
  </div>`;

  licao.secoes.forEach(secao => {
    html += `<div class="licao-secao">
      <h3 class="licao-subtitulo">${secao.subtitulo}</h3>
      ${secao.paragrafos.map((p, pIdx) => {
        const pid = secao.paragrafoIds[pIdx];
        const hl = highlightIds && highlightIds.includes(pid);
        return `<p class="licao-paragrafo ${hl ? 'highlighted' : ''}" id="${pid}">${p}</p>`;
      }).join('')}
    </div>`;
  });

  const prevIdx = idx - 1, nextIdx = idx + 1;
  const hasPrev = prevIdx >= 0, hasNext = nextIdx < MATERIA.length;
  html += `<div class="licao-footer-nav">
    <button class="licao-footer-btn" onclick="renderLicao(${prevIdx})" ${!hasPrev ? 'disabled' : ''}>← ${hasPrev ? 'Parte ' + MATERIA[prevIdx].numero : 'Anterior'}</button>
    <button class="licao-footer-btn" onclick="renderLicao(${nextIdx})" ${!hasNext ? 'disabled' : ''}>${hasNext ? 'Parte ' + MATERIA[nextIdx].numero : 'Próxima'} →</button>
  </div>`;

  html += '</div>';
  document.getElementById('root').innerHTML = html;
  if (!highlightIds) window.scrollTo({ top: 0 });
}

renderHome();
</script>
</body>
</html>
