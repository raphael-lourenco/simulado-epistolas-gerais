const DISSERTATIVAS = [{"numero": 1, "topico": "alianca", "enunciado": "Explique o argumento de Hebreus 8 a 10 sobre o sacerdócio levítico e a Nova Aliança.", "gabarito": "1) <strong>Introdução:<\/strong> Hb 8.1, “a suma é: temos tal sumo sacerdote, que está assentado à direita de Deus”. 2) O sistema sacrificial levítico era apenas uma <strong>sombra<\/strong> da realidade futura, que é a <strong>Nova Aliança em Cristo<\/strong>. 3) Os antigos sacrifícios <strong>não eram eficazes por serem repetitivos<\/strong>: a própria necessidade de repetição comprovava a ineficácia deles. 4) <strong>Conclusão:<\/strong> a lei antiga estava <strong>fadada a desaparecer<\/strong>, e o autor cita <strong>Jeremias 31 nos capítulos 8 e 10<\/strong> para provar que a antiga aliança estava sendo deixada de lado.", "fonte": ["p-5-0", "p-5-1", "p-5-2", "p-5-3", "p-5-4"], "destaque": true}, {"numero": 2, "topico": "proposito", "enunciado": "Qual é o propósito da Epístola aos Hebreus? Apresente o contexto dos destinatários.", "gabarito": "<strong>Contexto:<\/strong> os destinatários eram judeus-cristãos que estavam querendo voltar para o judaísmo. <strong>Propósito:<\/strong> a carta visa mostrar a superioridade de Jesus em relação à instituição judaica e ao sistema sacrificial levítico (ele é superior aos anjos, a Moisés, ao sacerdócio de Levi e aos sacrifícios antigos). Por isso, voltar ao judaísmo não faria sentido.", "fonte": ["p-1-0", "p-1-1", "p-1-2"], "destaque": true}, {"numero": 3, "topico": "genero", "enunciado": "Qual é o gênero da Epístola aos Hebreus? Que característica do próprio texto confirma isso?", "gabarito": "Hebreus é uma <strong>homilia<\/strong>. O próprio texto, em seu final, se autodenomina <strong>“palavra de exortação” (13.22)<\/strong>.", "fonte": ["p-2-0", "p-2-1"], "destaque": true}, {"numero": 4, "topico": "italia", "enunciado": "Apresente os dois argumentos que justificam a ligação do texto de Hebreus com a Itália.", "gabarito": "1) A menção no final da carta, em <strong>Hebreus 13<\/strong>: <strong>“Os da Itália vos saúdam”<\/strong> (13.24). 2) Os <strong>pontos de contato literário com outros textos vinculados a Roma<\/strong>, como <strong>1 Pedro<\/strong> e <strong>1 Clemente<\/strong> (lido em sala).", "fonte": ["p-3-1", "p-3-2"], "destaque": true}, {"numero": 5, "topico": "tiago", "enunciado": "Qual é a principal marca da epístola de Tiago e o que ela indica sobre a natureza e o gênero do texto?", "gabarito": "A principal marca é o <strong>alto número de verbos no imperativo<\/strong> (ex.: “Tornai-vos praticantes da palavra”, 1.22; “Sujeitai-vos a Deus; resisti ao diabo”, 4.7). É exatamente essa grande quantidade de imperativos que <strong>classifica Tiago como um texto de natureza e gênero exortatório<\/strong>.", "fonte": ["p-4-0", "p-4-1", "p-4-2"], "destaque": true}, {"numero": 6, "topico": "autoria", "enunciado": "Cite três propostas de autoria de Hebreus e quem as defendeu.", "gabarito": "Paulo: tradição do Oriente e P⁴⁶; Clemente de Alexandria (com Lucas como tradutor); Trento. Barnabé: Tertuliano. Apolo: Lutero (pela primeira vez). Clemente de Roma ou Lucas: Calvino. Priscila: Harnack. (Quaisquer três.)", "fonte": ["h-4-1", "h-4-3", "h-4-6", "h-6-2"], "destaque": false}, {"numero": 7, "topico": "autoria", "enunciado": "Por que a maioria dos estudiosos rejeita hoje a autoria paulina de Hebreus?", "gabarito": "Pesam as diferenças de vocabulário, estilo e retórica, a ausência da saudação com o nome do autor e a falta de temas paulinos (o sumo sacerdócio de Cristo, por outro lado, não aparece em Paulo). Acima de tudo: em 2.3 o autor diz que recebeu o evangelho dos que ouviram o Senhor, algo que Paulo não diria (Gl 1.11-12).", "fonte": ["h-5-0", "h-5-1"], "destaque": false}, {"numero": 8, "topico": "autoria", "enunciado": "Qual é a conclusão de Carson & Moo sobre o autor de Hebreus?", "gabarito": "Devemos reconhecer a ignorância: não sabemos quem escreveu (os primeiros leitores sabiam). Com toda a probabilidade, era um judeu helenista convertido, cristão da segunda geração (2.3), imerso na LXX e com boa formação.", "fonte": ["h-6-4"], "destaque": false}, {"numero": 9, "topico": "italia", "enunciado": "Explique as duas formas de interpretar “Os da Itália enviam saudações” (13.24) e o que cada uma implica.", "gabarito": "1) Italianos fora da Itália mandam saudações para casa: a carta foi enviada PARA a Itália, mas não sabemos de onde. 2) Crentes que estão na Itália mandam saudações: o autor escreve DA Itália, e não sabemos quem são os destinatários. Por isso a tradução ambígua da NEB (“nossos amigos italianos”) é atraente.", "fonte": ["h-7-1", "h-7-2"], "destaque": false}, {"numero": 10, "topico": "italia", "enunciado": "Qual é a relação entre Hb 13.24 e a hipótese de que a carta foi enviada a Roma?", "gabarito": "A hipótese de Roma exige ler “os da Itália” como italianos que estavam fora da Itália (como Priscila e Áquila) mandando saudações para casa. A favor: Hebreus foi conhecida primeiro em Roma (Clemente de Roma), e o Ocidente demorou a atribuí-la a Paulo. Mesmo assim, é conjectura.", "fonte": ["h-9-1"], "destaque": false}, {"numero": 11, "topico": "proposito", "enunciado": "Qual era a situação dos destinatários de Hebreus e por que o autor escreve?", "gabarito": "Eram cristãos judeus tentados a voltar a depender das estruturas religiosas da antiga aliança, talvez achando que seria só um cristianismo judaico mais conservador. Para o autor, isso é apostasia: dá ao sistema antigo uma eficácia redentora que ele nunca teve e relativiza Cristo e seu sacrifício. Ele escreve para evitar essa catástrofe.", "fonte": ["h-10-2", "h-10-4"], "destaque": false}, {"numero": 12, "topico": "proposito", "enunciado": "Que motivos podiam levar os leitores a voltar ao judaísmo?", "gabarito": "O cansaço da vergonha de viver à margem da herança cultural (13.13); a atração por ensinos inovadores em vez do evangelho apostólico (13.9; 13.7-8); e o medo de perseguição, pois o judaísmo era reconhecido por Roma e o cristianismo não. Além disso, eles abandonavam as reuniões (10.25).", "fonte": ["h-10-3"], "destaque": false}, {"numero": 13, "topico": "proposito", "enunciado": "Como a superioridade do sacerdócio de Jesus responde ao problema dos leitores?", "gabarito": "Se o sacerdócio de Jesus é eterno, superior ao levítico, confirmado por juramento (Sl 110.4) e seu sacrifício salva plenamente (7.25), voltar ao sacerdócio e aos sacrifícios antigos é trocar a realidade pela sombra. A superioridade de Cristo fundamenta as advertências contra a apostasia.", "fonte": ["s-3-1", "h-3-3", "h-1-1"], "destaque": false}, {"numero": 14, "topico": "alianca", "enunciado": "Explique como, em Hb 8–10, o sacerdócio levítico é sombra do sacerdócio de Cristo.", "gabarito": "O sumo sacerdote levítico e o antigo santuário são sombras da nova aliança e do novo sumo sacerdote anunciados pelos profetas (Jr 31.31-34). Seus sacrifícios repetidos não aperfeiçoavam; o sacrifício único de Cristo tem eficácia permanente. A antiga ordem existia para apontar para a realidade trazida pela nova (10.1).", "fonte": ["h-3-4", "h-3-5"], "destaque": false}, {"numero": 15, "topico": "alianca", "enunciado": "Segundo a aula, por que a obra de Jesus foi mais efetiva que a dos sumos sacerdotes levíticos (10.1-18)?", "gabarito": "1) Os sacerdotes levitas eram eles mesmos pecadores. 2) Repetiam seus sacrifícios muitas vezes (9.25; 10.1-3,11), sinal de imperfeição. 3) Ofereciam sacrifícios de animais, e é impossível que o sangue de touros e bodes remova pecados (10.4).", "fonte": ["s-3-4"], "destaque": false}, {"numero": 16, "topico": "alianca", "enunciado": "Qual é o significado de Hb 8.13 e qual sua relação com Jr 31.31-34?", "gabarito": "Ao anunciar por Jeremias uma “nova” aliança, Deus tornou a primeira obsoleta, e o que envelhece está prestes a desaparecer (8.13). A antiga aliança é deixada de lado: era sombra, e a nova, estabelecida pela morte de Cristo, é a realidade.", "fonte": ["h-3-4", "s-3-2"], "destaque": false}, {"numero": 17, "topico": "alianca", "enunciado": "Por que é impossível que o sangue de touros e bodes remova pecados (Hb 10.4)?", "gabarito": "a) As Escrituras predizem a substituição do sistema mosaico. b) Com base em Jr 31.31-34, esses sacrifícios só limpavam a carne (9.13-14), e não a consciência (9.15; 10.2,22). c) O Sl 40.6-8 apresenta o sacrifício voluntário do corpo de Cristo como substituto do sistema (10.7,9).", "fonte": ["s-3-5"], "destaque": false}, {"numero": 18, "topico": "tiago", "enunciado": "Cite o imperativo destacado em aula para Tg 1.19-27 e explique seu sentido.", "gabarito": "“Tornai-vos praticantes da Palavra (e não somente ouvintes)” (1.22). Não basta ouvir o Evangelho; é preciso viver de acordo com ele. A aula liga o imperativo ao paralelismo “prática e não-prática” e às imagens da semeadura e do espelho.", "fonte": ["t-1-0", "t-1-1"], "destaque": false}, {"numero": 19, "topico": "geral", "enunciado": "Por que Carson & Moo favorecem uma data anterior a 70 d.C. para Hebreus?", "gabarito": "O autor argumenta que os sacrifícios são obsoletos e pergunta se eles não teriam deixado de ser oferecidos (10.1-2). Se o Templo e os sacrifícios já tivessem acabado em 70, seria difícil ele não mencionar isso. É um argumento do silêncio, mas forte.", "fonte": ["h-8-3", "h-8-4"], "destaque": false}];
const MATERIA = [{"numero": 1, "rotulo": "Guia da prova", "titulo": "O que o professor quer na prova", "fonte": "Orientações do professor sobre a AV1, repassadas pela turma. Os complementos estão marcados.", "secoes": [{"subtitulo": "Estrutura da prova", "paragrafos": ["A avaliação tem <strong>7 questões objetivas<\/strong> e <strong>apenas 2 questões discursivas<\/strong>. Os simulados deste site seguem esse formato."], "paragrafoIds": ["p-0-0"]}, {"subtitulo": "Hebreus — Propósito (cai em duas questões)", "paragrafos": ["<strong>Contexto que você precisa apresentar:<\/strong> os destinatários eram <strong>judeus-cristãos que estavam querendo voltar para o judaísmo<\/strong>.", "<strong>Resposta central sobre o propósito:<\/strong> a carta visa mostrar <strong>a superioridade de Jesus em relação à instituição judaica e ao sistema sacrificial levítico<\/strong>.", "<em>Complemento (Carson & Moo e slides):<\/em> por isso o autor compara Jesus com tudo o que os leitores estariam tentados a buscar de volta: ele é superior aos anjos (1.5-14), a Moisés (3.1-6), ao sacerdócio de Levi (cap. 7) e aos sacrifícios da antiga aliança (caps. 8–10). Voltar ao judaísmo seria apostasia, pois daria ao sistema antigo uma eficácia que ele nunca teve."], "paragrafoIds": ["p-1-0", "p-1-1", "p-1-2"]}, {"subtitulo": "Hebreus — Gênero e natureza", "paragrafos": ["<strong>Resposta direta sobre o gênero:<\/strong> Hebreus é <strong>uma homilia<\/strong> (um sermão).", "<strong>Característica para não esquecer:<\/strong> o próprio texto, em seu final, se autodenomina <strong>“palavra de exortação” (Hb 13.22)<\/strong>.", "<em>Complemento (Carson & Moo):<\/em> a obra começa sem a saudação típica das cartas, tem grande riqueza retórica e só termina em forma de carta (13.20-25). Por isso se diz que é uma homilia colocada na forma escrita de uma carta."], "paragrafoIds": ["p-2-0", "p-2-1", "p-2-2"]}, {"subtitulo": "Hebreus — Vínculo com a Itália (atenção aos slides)", "paragrafos": ["Lembre-se de <strong>dois argumentos<\/strong> que justificam a ligação do texto com a Itália:", "<strong>1º argumento:<\/strong> a menção no final da carta, em <strong>Hebreus 13<\/strong>: <strong>“Os da Itália vos saúdam”<\/strong> (13.24).", "<strong>2º argumento:<\/strong> os <strong>pontos de contato literário com outros textos vinculados a Roma<\/strong>, como <strong>1 Pedro<\/strong> e <strong>1 Clemente<\/strong>. O professor leu em sala o capítulo 35 ou 37 de 1 Clemente.", "<em>Complemento:<\/em> 1 Clemente é a carta da igreja de Roma (c. 96 d.C.), e Carson & Moo lembram que ela faz repetidas referências a Hebreus (1Clem 36.1-6). Roma é o primeiro lugar onde se sabe que Hebreus foi conhecida. 1 Pedro manda saudações da igreja “que está em Babilônia” (1Pe 5.13), nome tradicionalmente entendido como Roma."], "paragrafoIds": ["p-3-0", "p-3-1", "p-3-2", "p-3-3"]}, {"subtitulo": "Tiago — Natureza e gênero", "paragrafos": ["<strong>O que deve constar na resposta:<\/strong> a principal marca da epístola de Tiago é o <strong>alto número de verbos no imperativo<\/strong>.", "<strong>A conclusão que ele quer:<\/strong> é exatamente essa grande quantidade de imperativos que <strong>classifica Tiago como um texto de natureza e gênero exortatório<\/strong>.", "<em>Exemplos (ARA):<\/em> “Tornai-vos praticantes da palavra” (1.22); “peça-a a Deus” (1.5); “Sujeitai-vos a Deus; resisti ao diabo” (4.7); “Sede pacientes” (5.7); “não jureis” (5.12)."], "paragrafoIds": ["p-4-0", "p-4-1", "p-4-2"]}, {"subtitulo": "Discursiva de Hebreus 8–10: o que ele quer ler", "paragrafos": ["<strong>1. Introdução:<\/strong> comece por <strong>Hebreus 8.1<\/strong>: <strong>“a suma é: temos tal sumo sacerdote, que está assentado à direita de Deus”<\/strong>.", "<strong>2. Como explicar os capítulos:<\/strong> o <strong>sistema sacrificial levítico era apenas uma “sombra” da realidade futura<\/strong>, que é a <strong>Nova Aliança em Cristo<\/strong> (cf. 8.5; 10.1).", "<strong>3. Argumento central:<\/strong> os antigos sacrifícios <strong>não eram eficazes por serem repetitivos<\/strong>, e <strong>a própria necessidade de repetição já comprovava a ineficácia deles<\/strong> (cf. 10.1-4,11).", "<strong>4. Conclusão:<\/strong> a <strong>lei antiga estava fadada a desaparecer<\/strong>, e o autor justifica isso <strong>citando Jeremias 31 nos capítulos 8 e 10<\/strong> (8.8-12; 10.16-17) para provar que <strong>a antiga aliança estava sendo deixada de lado<\/strong> (cf. 8.13).", "<strong>Resposta modelo:<\/strong> <em>“A suma do argumento é que temos tal sumo sacerdote, que está assentado à direita de Deus (8.1). Diante dele, o sistema sacrificial levítico era apenas sombra da realidade futura, que é a Nova Aliança em Cristo. Os antigos sacrifícios não eram eficazes, e a prova disso é que precisavam ser repetidos continuamente: a própria repetição mostrava sua ineficácia, enquanto Cristo ofereceu um único sacrifício. Por isso a lei antiga estava fadada a desaparecer, e o autor cita Jeremias 31 nos capítulos 8 e 10 para provar que a antiga aliança estava sendo deixada de lado.”<\/em>"], "paragrafoIds": ["p-5-0", "p-5-1", "p-5-2", "p-5-3", "p-5-4"]}]}, {"numero": 2, "rotulo": "Carson & Moo", "titulo": "Hebreus — Introdução", "fonte": "CARSON, D. A.; MOO, D. J. Introdução ao Novo Testamento — capítulo de Hebreus.", "secoes": [{"subtitulo": "Gênero: carta ou homilia?", "paragrafos": ["Hebreus começa <strong>sem saudação<\/strong> e sem indicar o autor e os destinatários — algo comum nas cartas greco-romanas e presente em todas as cartas do NT, <strong>exceto 1João<\/strong>. Mesmo assim, termina de forma tipicamente epistolar: bênção, notas pessoais e despedida (13.20-25). As advertências específicas mostram que o autor tem leitores definidos em mente (5.12; 6.10; 10.32).", "Em 13.22 o autor chama sua obra de “palavra de exortação”. A riqueza de recursos retóricos indica que, provavelmente, a obra foi originalmente <strong>uma homilia (ou série de homilias) colocada na forma escrita de uma carta “um pouco anômala”<\/strong>. Não há evidência textual de que o início tenha se perdido ou de que o fim tenha sido acrescentado: Hebreus 13 é parte integral da obra."], "paragrafoIds": ["h-0-0", "h-0-1"]}, {"subtitulo": "Tema geral", "paragrafos": ["O tema não é debatido: a <strong>supremacia inconteste do Filho de Deus, Jesus Cristo<\/strong>, não desafiada nem por anjos nem por humanos. De forma correlata: a aliança que ele estabeleceu é superior a qualquer outra; o <strong>sacerdócio dele é melhor do que o de Levi<\/strong>; o sacrifício dele é superior aos da legislação mosaica; e até a revelação anterior tinha o propósito de antecipá-lo e apontar para ele.", "A supremacia de Cristo não é um “artigo abstrato”: seu propósito aparece nos trechos parenéticos (exortações) — 2.1-4; 3.7—4.11; 4.14-16; 5.11—6.12; 10.19-39; 12.1—13.17 —, escritos para <strong>advertir os leitores a não voltarem às formas de piedade que antes conheciam, abandonando a fé cristã<\/strong>."], "paragrafoIds": ["h-1-0", "h-1-1"]}, {"subtitulo": "Estrutura", "paragrafos": ["Há consenso de que o livro foi cuidadosamente estruturado, mas não sobre a forma dessa estrutura. Propostas: argumentação de 1.1 a 10.18 seguida de exortações (10.19—13.25), considerada pouco minuciosa; cinco divisões em quiasmo entre introdução (1.1-4) e conclusão (13.20-21), considerada forçada; um longo prólogo (1.1—4.13), duas apresentações de Jesus como sumo sacerdote (4.14—6.20; 7.1—10.18) e um longo epílogo (10.19—13.25); e o esquema de Kümmel, baseado nos trechos parenéticos.", "Attridge observa que as unidades menores são bem delineadas; o problema é vinculá-las na estrutura maior. O esboço mais detalhado e consistente talvez seja o de <strong>Guthrie<\/strong>, que usa a análise do discurso (linguística textual) para mostrar a interação entre exposição e exortação ao longo do documento."], "paragrafoIds": ["h-2-0", "h-2-1"]}, {"subtitulo": "Fluxo do argumento", "paragrafos": ["O <strong>exórdio (1.1-4)<\/strong> destaca o caráter superior e definitivo da revelação no Filho. Segue o argumento de que ele é <strong>superior aos anjos (1.5-14)<\/strong> e a primeira advertência (2.1-4): se até a revelação antiga e inferior trouxe juízos, não podemos nos afastar do evangelho. Jesus se identificou com os seres humanos mortais e caídos para levá-los ao seu destino, tornando-se “sumo sacerdote misericordioso e fiel” (2.17).", "Jesus e Moisés foram fiéis, mas Jesus é o <strong>Filho<\/strong> da casa (3.1-6). Vem a advertência contra a incredulidade da geração de Moisés, numa exposição do Sl 95.7-11 sobre o <strong>“descanso”<\/strong> (3.7—4.11): Josué levou o povo a Canaã, mas aquele não era o descanso derradeiro; o descanso que Jesus dá é da mesma natureza do descanso de Deus. Fugir dessa palavra perscrutadora é tolice (4.12-13).", "Jesus é o sumo sacerdote capaz de se solidarizar com nossas fraquezas (4.14-16). As qualificações dos sumos sacerdotes da antiga aliança (5.1-4) aparecem de forma superlativa em Cristo (5.5-10), “segundo a ordem de Melquisedeque”. Antes de explorar o título, o autor insere uma advertência severa (5.11—6.20): condena a imaturidade, afirma que é impossível recuperar apóstatas, incentiva a perseverança e lembra a certeza da promessa de Deus.", "No cap. 7, o autor liga <strong>Gn 14.18-20 e o Sl 110<\/strong> para mostrar a superioridade do sacerdócio de Melquisedeque sobre o de Levi — e que Jesus pertence ao primeiro. O ponto decisivo é a <strong>eficácia permanente do sacrifício de Jesus<\/strong>: os sacrifícios da antiga aliança não aperfeiçoavam nada (7.19), mas Jesus pode “salvar plenamente os que vêm a Deus por meio dele” (7.25). Em Hebreus, perfeição é essencialmente <strong>completude<\/strong> — sobretudo do plano divino de salvação.", "À luz disso, <strong>o sumo sacerdote levítico e o antigo santuário não passam de sombras da nova aliança e do novo sumo sacerdote<\/strong> que os próprios profetas anteviram (Hb 8.1-13; <strong>Jr 31.31-34<\/strong>). O anúncio da nova aliança já tinha tornado <strong>a aliança mosaica velha e obsoleta (8.13)<\/strong>.", "Isso leva à exposição do ritual do Tabernáculo, especialmente do <strong>Dia da Expiação (9.1-10)<\/strong>, para mostrar que o sacrifício de Cristo alcança um resultado duradouro que os antigos sacrifícios jamais pretenderam alcançar (9.11-28). <strong>A antiga ordem tinha o objetivo de ser uma sombra da realidade introduzida pela nova (10.1-18)<\/strong>. A entronização do novo sumo sacerdote confirma o caráter definitivo e a eficácia permanente de sua obra.", "A longa seção parenética (10.19—11.39) incentiva os leitores a permanecerem firmes: desviar-se é perigoso por causa da <strong>suficiência exclusiva da nova aliança<\/strong>. A fé perseverante é modelada pelas Escrituras (cap. 11). Os leitores devem olhar para Jesus, o <strong>“pioneiro” (não o “autor”) e aperfeiçoador da fé<\/strong> (12.1-3); suportar as tribulações como disciplina amorosa de Deus (12.4-11); e não se alinhar a Esaú (12.12-17). O autor contrasta a Sião celestial com o Sinai terreno (12.18-29).", "As exortações finais (13.1-17) trazem instruções éticas (13.1-6), o exemplo dos primeiros líderes (13.7-8), a submissão aos líderes atuais (13.17) e o <strong>“sacrifício de louvor”<\/strong>, contrastado com os sacrifícios da antiga aliança, cumpridos no sacrifício de Jesus “fora do acampamento” (13.9-16). A carta termina com pedido de oração (13.18-19), doxologia (13.20-21), observações pessoais (13.22-23) e saudações finais (13.24-25)."], "paragrafoIds": ["h-3-0", "h-3-1", "h-3-2", "h-3-3", "h-3-4", "h-3-5", "h-3-6", "h-3-7"]}, {"subtitulo": "Autor: a tradição antiga", "paragrafos": ["No texto mais antigo de Hebreus, o <strong>P⁴⁶ (início do séc. 3)<\/strong>, a carta está no corpus paulino, <strong>logo depois de Romanos<\/strong>. Isso reflete a convicção da igreja do Oriente, que se apoiava nos estudiosos alexandrinos cujas opiniões Eusébio preservou.", "<strong>Clemente de Alexandria<\/strong> (c. 150-215) mantém Paulo como autor, mas admite as dificuldades: o grego de Hebreus é mais refinado que o de Paulo e parecido com o de Lucas-Atos. Por isso supõe que <strong>Paulo escreveu em hebraico e Lucas traduziu<\/strong>. Explica a falta do nome de Paulo dizendo que ele escrevia a <strong>judeus com forte preconceito contra ele<\/strong> e, por prudência, não se identificou.", "<strong>Orígenes<\/strong> (185-253) diz que o conteúdo não é inferior ao das cartas de Paulo, mas acha que <strong>um discípulo tomou notas do que o apóstolo disse e reescreveu o material<\/strong>. Sabia que alguns apontavam Lucas e outros Clemente de Roma, mas recusou-se a especular: <strong>“quem escreveu a carta só Deus sabe”<\/strong>.", "Na <strong>igreja ocidental<\/strong>, houve resistência à autoria paulina até a 2ª metade do séc. 4: o <strong>Cânon Muratoriano, Ireneu e Hipólito<\/strong> negam que Paulo seja o autor. A única proposta alternativa antiga é a de <strong>Tertuliano (séc. 2): Barnabé<\/strong> — e ele diz que Hebreus tem mais autoridade que O Pastor, de Hermas, por causa da importância do autor.", "Foi a opinião conjunta de <strong>Jerônimo e Agostinho<\/strong> que mudou o Ocidente — menos pela crítica literária e mais porque a autoria apostólica favorecia a aceitação no cânon. Jerônimo reconhece as dúvidas, mas diz que não importa quem foi o autor, pois a obra é “honrada diariamente com sua leitura nas igrejas”.", "O <strong>Sínodo de Hipona (393)<\/strong> e o <strong>3º Sínodo de Cartago (397)<\/strong> listam: “Do apóstolo Paulo, <strong>treze cartas<\/strong>; do mesmo apóstolo, aos Hebreus, uma” — ainda distinguindo Hebreus das demais. No <strong>6º Sínodo de Cartago (419)<\/strong>, <strong>catorze<\/strong> cartas são atribuídas a Paulo. Mesmo depois, comentaristas cultos fazem ressalvas: Tomás de Aquino diz que Lucas traduziu a carta para um grego excelente.", "Na <strong>Reforma<\/strong>, a tradição foi reexaminada: <strong>Calvino<\/strong> (comentando 13.23) defendeu <strong>Clemente de Roma ou Lucas<\/strong>; <strong>Lutero propôs — pela primeira vez, até onde se sabe — Apolo<\/strong>. O <strong>Concílio de Trento<\/strong> reagiu insistindo em catorze cartas paulinas."], "paragrafoIds": ["h-4-0", "h-4-1", "h-4-2", "h-4-3", "h-4-4", "h-4-5", "h-4-6"]}, {"subtitulo": "Autor: por que não Paulo?", "paragrafos": ["A última defesa importante da autoria paulina foi escrita há mais de meio século; hoje praticamente ninguém a repetiria. As diferenças de <strong>vocabulário, estilo grego e retórica<\/strong> não a tornam impossível, mas menos plausível. Pesam também: a <strong>ausência da saudação com o nome do autor<\/strong>, prática usual de Paulo; a ausência de vários temas paulinos comuns; e o fato de o <strong>sumo sacerdócio de Cristo<\/strong>, central em Hebreus, não aparecer nas cartas paulinas reconhecidas.", "<strong>Acima de tudo<\/strong>: é praticamente impossível que Paulo se apresentasse como alguém que ouviu o evangelho não do Senhor, mas <strong>daqueles “que o ouviram” (2.3)<\/strong> — compare com Gl 1.11-12, onde Paulo diz ter recebido o evangelho por revelação de Jesus Cristo.", "<strong>Lucas<\/strong> e <strong>Clemente de Roma<\/strong> também recebem poucos votos hoje. As conexões entre Lucas e Hebreus são tênues demais. Clemente parece citar Hebreus e tem abordagem muito distante: para falar do ministério da igreja, apela às leis cerimoniais do AT — postura totalmente divergente da de Hebreus."], "paragrafoIds": ["h-5-0", "h-5-1", "h-5-2"]}, {"subtitulo": "Autor: outras propostas", "paragrafos": ["<strong>Barnabé<\/strong>: levita de Chipre (At 4.36), do grupo helenista de Jerusalém, colaborador de Paulo. Era chamado <em>huios paraklēseōs<\/em>, “filho da exortação/encorajamento” (At 4.36), e Hebreus se chama <em>logos tēs paraklēseōs<\/em>, “palavra de exortação” (13.22). <em>Contra:<\/em> <em>paraklēsis<\/em> é comum demais no NT para apontar uma só pessoa; e Hebreus não é só contra o Templo, mas mostra a obsolescência de todo o sistema de rituais em princípio.", "<strong>Apolo (proposta de Lutero)<\/strong>: “homem eloquente” e com “conhecimento profundo das Escrituras” (At 18.24), natural de <strong>Alexandria<\/strong> (há ligações de Hebreus com Fílon de Alexandria) e ligado à missão de Paulo (1Co 1—4). <em>Contra:<\/em> é uma “conjectura brilhante”, mas sem evidências para testá-la; o pensamento de Hebreus está longe do neoplatonismo e do estoicismo de Fílon — seria “especulação em cima de especulação”.", "<strong>Priscila<\/strong> (desde Harnack), talvez com Áquila: explicaria a oscilação entre “nós” e “eu”; o casal ensinou Apolo (At 18.26) e conhecia Timóteo (Hb 13.23); o nome teria sumido por tendências antifeministas. <em>Contra:<\/em> indícios insuficientes e, sobretudo, o autor se refere a si mesmo <strong>no masculino singular em 11.32<\/strong>.", "Objeções semelhantes valem para outras sugestões: Silas, Timóteo, Epafras, o diácono Filipe ou Maria, mãe de Jesus.", "<strong>Conclusão de Carson & Moo:<\/strong> é melhor reconhecer nossa ignorância. Não sabemos quem escreveu; os primeiros leitores quase certamente sabiam. Com toda a probabilidade, o autor era um <strong>judeu helenista convertido<\/strong>, <strong>crente da segunda geração (2.3)<\/strong>, <strong>imerso na LXX<\/strong> (nenhuma de suas citações do AT depende do hebraico) e com <strong>boa formação<\/strong>, a julgar pelo vocabulário e pelo estilo grego excelentes."], "paragrafoIds": ["h-6-0", "h-6-1", "h-6-2", "h-6-3", "h-6-4"]}, {"subtitulo": "Local de origem: “os da Itália” (13.24)", "paragrafos": ["A <strong>única indicação explícita<\/strong> do local de origem está em <strong>13.24: “Os da Itália enviam saudações”<\/strong>. Infelizmente, a frase não é clara.", "<strong>Leitura 1:<\/strong> são crentes italianos que deixaram sua terra e mandam saudações para casa — então a carta foi enviada <strong>PARA a Itália<\/strong>, mas não sabemos de onde partiu. <strong>Leitura 2:<\/strong> são crentes que estão <strong>na<\/strong> Itália — então o autor escreve <strong>DA Itália<\/strong>, mas não sabemos quem são os destinatários.", "Como não dá para saber o que o autor quis dizer, a <strong>ambiguidade da tradução da NEB<\/strong> é atraente: <strong>“Saudações a vocês da parte de nossos amigos italianos”<\/strong>. Mesmo que soubéssemos quem é o autor, isso não fixaria a procedência geográfica, pois ele podia circular bastante (como Paulo). Numa obra tão parenética, a argumentação é moldada pelas necessidades dos leitores: a análise das categorias conceituais do livro revela <strong>mais sobre o público-alvo do que sobre o autor<\/strong>."], "paragrafoIds": ["h-7-0", "h-7-1", "h-7-2"]}, {"subtitulo": "Data", "paragrafos": ["Autor e leitores pertencem à <strong>segunda geração<\/strong> de cristãos (2.3) — no sentido genealógico, não cronológico. Provavelmente a carta não é anterior a 50 d.C.; a maioria diria que não é anterior a 60.", "<strong>1Clemente<\/strong> (36.1-6) faz repetidas referências a Hebreus. Com a data tradicional de 1Clemente, <strong>96 d.C.<\/strong>, temos a data máxima para Hebreus (embora a base dessa data — a perseguição de Domiciano — seja tênue). Se o Timóteo de 13.23 é o colega de Paulo, a carta foi escrita durante a vida dele, o que dá <strong>c. 100<\/strong> como data mais avançada.", "Hb 12.4 (“ainda não resististes até ao sangue”) pode ser figurado. Se se refere a mártires, pode indicar uma data anterior à perseguição de Nero (64 d.C.) — ou leitores de outra região, depois dela. É arriscado usar o versículo para fixar uma data.", "O uso de <strong>verbos no presente<\/strong> para o ritual judaico (7.8; 9.6-7,9,13; 13.10) não é decisivo: o presente grego não indica necessariamente o tempo presente, e Clemente e Josefo também usam o presente depois de 70. Mas há uma forma mais forte do argumento: o autor argumenta a <strong>obsolescência<\/strong> dos sacrifícios (8.13) e pergunta se eles não “teriam deixado de ser oferecidos” (10.1-2). Se os sacrifícios tivessem acabado em 70 d.C., seria difícil ele não assinalar isso. É um argumento baseado no silêncio, mas <strong>forte<\/strong>.", "O argumento mais forte para data tardia — uma cristologia “alta” em 1.1-3 — não se sustenta: 1Co 8.6, Fp 2.6-11 e Cl 1.15-20 são anteriores a 70. <strong>Conclusão:<\/strong> nenhuma data entre c. 60 e 100 pode ser eliminada, mas <strong>as evidências favorecem uma data anterior a 70<\/strong>."], "paragrafoIds": ["h-8-0", "h-8-1", "h-8-2", "h-8-3", "h-8-4"]}, {"subtitulo": "Destinatários", "paragrafos": ["As referências a experiências dos leitores (10.32-34) mostram um grupo específico. Muitos pensaram na <strong>Palestina/Jerusalém<\/strong>, por causa das referências ao ritual. Mas o silêncio absoluto sobre o Templo (em contraste com o Tabernáculo), o grego refinado e o uso exclusivo da LXX enfraquecem essa teoria.", "Foram propostas Alexandria, Antioquia, Bitínia e Ponto, Cesareia, Colossos, Corinto, Chipre, Éfeso e Samaria, mas a única outra proposta com apoio razoável é <strong>Roma<\/strong>: é o primeiro lugar em que a carta foi conhecida (Clemente de Roma), e a demora de Roma e do Ocidente em atribuí-la a Paulo pode indicar que sabiam que não era dele. Essa teoria exige ler <strong>“os da Itália” (13.24) como italianos que estavam fora da Itália<\/strong> (como Priscila e Áquila). <strong>Harnack<\/strong> pensava numa igreja doméstica em Roma; <strong>Manson<\/strong>, numa facção conservadora judaico-cristã. Ainda assim, Roma “não passa de conjectura”."], "paragrafoIds": ["h-9-0", "h-9-1"]}, {"subtitulo": "Propósito", "paragrafos": ["O título “Aos hebreus” (<em>Pros Hebraious<\/em>) já aparece no P⁴⁶ e era conhecido por Clemente de Alexandria (c. 180), mas a maioria o considera um rótulo editorial posterior. O conteúdo deve decidir. Todos concordam que o livro é escrito <strong>a cristãos<\/strong>, instados a <strong>sustentar sua confissão<\/strong> (3.6,14; 4.14; 10.23).", "Alguns propõem leitores gentios: o conhecimento do ritual viria da leitura, e “afastar-se do Deus vivo” (3.12) combinaria com pagãos. Mas o exemplo de 3.12 é o próprio Israel no deserto; os “ensinos elementares” (6.1) pressupõem o judaísmo; não há sinal de propaganda judaizante nem menção à circuncisão; e muitos argumentos desafiam a ideia de que <strong>o culto do Sinai era definitivo (7.11)<\/strong> — algo de que só precisaria quem corresse o risco de voltar ao judaísmo.", "Conclusão: os leitores eram <strong>cristãos judeus<\/strong> (provavelmente do judaísmo helenista), tentados a <strong>voltar a depender das estruturas religiosas da antiga aliança<\/strong> — talvez pensando que seria apenas um cristianismo judaico mais conservador. Para o autor, isso <strong>não é cristianismo de forma alguma: é apostasia<\/strong>. Voltar a essas estruturas é <strong>atribuir-lhes uma eficácia redentora que nunca tiveram<\/strong> e <strong>menosprezar a importância exclusiva de Cristo e de seu sacrifício<\/strong>.", "Os motivos são apenas insinuados: <strong>cansaço da vergonha<\/strong> de viver à margem da herança cultural (13.13); atenção a <strong>ensinos inovadores<\/strong> (13.9) em vez do evangelho apostólico (13.7-8); e talvez <strong>medo<\/strong> — <strong>o judaísmo era religião reconhecida pelos romanos; o cristianismo não<\/strong>, e voltar diminuiria a ameaça de perseguição. A disciplina se deteriorava com o <strong>abandono das reuniões<\/strong> (10.25), talvez uma igreja doméstica que já não se reunia com o restante.", "Mais do que os motivos, interessam ao autor as <strong>consequências<\/strong>: Cristo, seu sacrifício e sua obra sacerdotal ficam tão relativizados que, na prática, são negados — e a apostasia está a um passo. <strong>É para evitar essa catástrofe que ele escreve<\/strong>, mostrando a superioridade de Cristo, de sua aliança e de seu sacerdócio."], "paragrafoIds": ["h-10-0", "h-10-1", "h-10-2", "h-10-3", "h-10-4"]}, {"subtitulo": "Texto e aceitação no cânon", "paragrafos": ["Os manuscritos mais importantes são, em sua imensa maioria, <strong>alexandrinos<\/strong>; a tradição bizantina é representada pelos unciais K e L (séc. 9), e o texto ocidental por D (Codex Claromontanus, séc. 6) e pela Antiga Latina. O texto está bem preservado, com decisões difíceis em alguns versículos (1.8; 11.17,37; 12.3,7).", "No <strong>Ocidente<\/strong>, a carta era conhecida e citada (Clemente de Roma, Inácio, Hermas, Justino), mas não tratada como apostólica ou canônica; o <strong>Cânon Muratoriano (c. 170-80) exclui Hebreus<\/strong>. Em <strong>Alexandria e no Oriente<\/strong>, nunca se duvidou de sua canonicidade; <strong>Eusébio<\/strong> a inclui entre os livros “reconhecidos”, e os pais sírios jamais a questionaram. No fim, o Oriente prevaleceu no Ocidente pela influência de Jerônimo e Agostinho."], "paragrafoIds": ["h-11-0", "h-11-1"]}, {"subtitulo": "Estudos recentes e contribuição de Hebreus", "paragrafos": ["Áreas de interesse: a <strong>cristologia<\/strong> (a exposição da obra sacerdotal de Cristo é mais completa aqui do que em qualquer outro trecho do NT); <strong>Melquisedeque<\/strong> (comparado às tradições dos manuscritos do mar Morto); o <strong>uso do AT<\/strong> (só Mateus se equipara); o tema do <strong>povo peregrino<\/strong> (Käsemann, <em>The wandering people of God<\/em>); perfeição, descanso (cap. 4), fé (cap. 11) e nova aliança. <strong>John Hughes<\/strong> mostrou que, em Hb 9, <em>diathēkē<\/em> deve ser entendido como <strong>“aliança”, e não “testamento”<\/strong>.", "<strong>Contribuição:<\/strong> Hebreus enriquece a cristologia do NT — obra sacerdotal de Jesus, caráter definitivo do seu sacrifício, sua filiação, a importância da encarnação (cap. 2) e seu papel de <strong>“pioneiro” (<em>archēgos<\/em>)<\/strong>. Ensina a interpretar o AT (tipologia, profecia que vai além da predição verbal). Trata da transição entre Israel, sob a aliança do Sinai, e a igreja, sob a aliança selada pela morte e ressurreição de Jesus. E, como 1João, preocupa-se com a perseverança e o perigo da apostasia."], "paragrafoIds": ["h-12-0", "h-12-1"]}]}, {"numero": 3, "rotulo": "Aulas 4–5", "titulo": "Hebreus — Síntese teológica", "fonte": "Slides do Prof. Dr. Leonardo Silveira (FABAT) — Aula 04-05.", "secoes": [{"subtitulo": "Exórdio — a intervenção divina na história humana (1.1-4)", "paragrafos": ["Na primeira linha, o autor revela a estratégia de toda a sua homilia: compara a maneira como Deus falou no passado com a maneira como fala “nestes últimos dias”. Ele atribui três características às Escrituras antigas: são <strong>fragmentadas<\/strong> (<em>polymerōs<\/em>), <strong>multiformes<\/strong> (<em>polytropōs<\/em>) e <strong>pertencem ao passado<\/strong> (<em>palai<\/em>).", "A alusão ao Sl 2.8 tem força escatológica (aponta para o domínio total de Cristo). A <strong>herança<\/strong> é tema-chave do livro (1.14; 6.12,17; 9.15; 11.7,8; 12.17). “Assentou-se à direita da Majestade nas alturas” é alusão evidente ao <strong>Sl 110.1<\/strong> (109.1 LXX). O uso de <em>ónoma<\/em> (“nome”) em 1.4 pode ecoar o contexto messiânico de 2Sm 7."], "paragrafoIds": ["s-0-0", "s-0-1"]}, {"subtitulo": "1ª parte — Posição de Cristo (1.5—2.18)", "paragrafos": ["<strong>Jesus superior aos anjos (1.5-14):<\/strong> o autor seleciona <strong>sete citações do AT (LXX)<\/strong>. (1) Sl 2.7 (1.5): a relação de <strong>Filho<\/strong>, que nenhum anjo partilha. (2) 2Sm 7.14 (1.5): reforça a relação filial — os anjos são servos que adoram o Filho — e liga o Sl 2.7 à cadeia que celebra a exaltação do Filho. (3) 1.6, sem fonte conhecida (elementos de Dt 32.43 e Sl 97.6): os anjos devem reverenciar o <strong>“primogênito”<\/strong> (<em>prōtotokos<\/em>). (4) Sl 104.4 (1.7): lugar e ministério inferiores dos anjos. (5) Sl 45.6-7 (1.8-9): a alta posição do Filho. (6) Sl 102.25-26 (1.10-12): seu poder criativo. (7) <strong>Sl 110.1 (1.13)<\/strong>: fecha e recapitula — <strong>Jesus é muito superior aos anjos<\/strong>.", "<strong>Reconhecer sua autoridade (2.1-4):<\/strong> Deus usou anjos para entregar a lei a Moisés; se a desobediência à lei menor trazia retribuição certa, a desobediência à palavra da salvação seria muito mais grave. <strong>Solidariedade com os homens (2.5-18):<\/strong> pelo Sl 8.4-6, Jesus, por sua encarnação e morte, assumiu o papel que Deus pretendia para a humanidade."], "paragrafoIds": ["s-1-0", "s-1-1"]}, {"subtitulo": "2ª parte — Cristo, nosso sumo sacerdote (3.1—5.10)", "paragrafos": ["<strong>3.1-6:<\/strong> em sua fidelidade, Jesus é posto lado a lado com Moisés, que foi “fiel em toda a casa de Deus” (3.2; Nm 12.6-8); “casa” = Israel, o povo de Deus. <strong>3.7—4.14:<\/strong> a geração do deserto é o exemplo negativo de quem começa a peregrinação rumo a Deus, mas tem o coração endurecido no caminho.", "<strong>4.15—5.10:<\/strong> Jesus é semelhante aos outros sumos sacerdotes (participa da condição humana), mas há uma diferença: <strong>seu sofrimento e provação não eram resultado do pecado<\/strong>. O autor demonstra a superioridade escatológica do seu sumo sacerdócio de três maneiras: (I) <strong>ele aperfeiçoa o sacerdócio<\/strong>; (II) <strong>é fonte de salvação eterna para todos os que lhe obedecem<\/strong>; (III) <strong>pertence à ordem sacerdotal de Melquisedeque<\/strong>."], "paragrafoIds": ["s-2-0", "s-2-1"]}, {"subtitulo": "3ª parte — Jesus, sumo sacerdote feito perfeito (5.11—10.39)", "paragrafos": ["<strong>1ª grande exortação (5.11—6.20):<\/strong> Jesus é o perfeito sumo sacerdote, e é impossível que os que participaram das bênçãos escatológicas se arrependam de novo se decaírem. O autor alerta os leitores para não retrocederem na fé nem se desviarem do caminho que leva ao Monte Sião, a Jerusalém celestial.", "<strong>O sacerdócio glorioso do Filho (7.1-28):<\/strong> a ordem de Melquisedeque torna Jesus superior aos sumos sacerdotes da lei mosaica em <strong>quatro aspectos<\/strong>: (1) <strong>seu sacerdócio é eterno<\/strong>; (2) <strong>é superior ao dos levitas<\/strong>; (3) <strong>resulta da mudança feita por Deus nas leis que governavam o serviço sacerdotal<\/strong>; (4) <strong>o juramento divino o confirma (Sl 110.4)<\/strong>. Síntese: por pertencer à ordem de Melquisedeque e receber homenagem de Abraão e Levi, o sacerdócio de Jesus é eterno, uma instituição posterior e mais perfeita de Deus, estabelecida com juramento — <strong>superior em tudo ao sumo sacerdócio levítico<\/strong>.", "<strong>Síntese central (8.1—9.28):<\/strong> o sofrimento de Jesus resulta em perfeição. Primeiro, o autor cita a profecia de <strong>Jr 31.31-34<\/strong> (LXX 38.31-34) de que Deus fará uma <strong>nova aliança<\/strong> (Hb 8.7-13). Depois, usa o tabernáculo do deserto para mostrar que é preciso um aperfeiçoamento por meio de um tabernáculo vindouro: <strong>as duas partes do tabernáculo terreno correspondem às duas eras da aliança<\/strong> — ilustram as duas partes da história da salvação.", "Para essa situação “perfeita” se tornar realidade, o Filho real e sumo sacerdote escatológico <strong>devia morrer e, por sua morte, estabelecer a nova aliança<\/strong>. Esse aperfeiçoamento pelo sofrimento o qualifica a servir no <strong>tabernáculo celestial<\/strong> e a sentar-se à direita de Deus, separando sua obra das <strong>tarefas provisórias<\/strong> dos sumos sacerdotes anteriores.", "<strong>Princípio de salvação eterna (10.1-18):<\/strong> a obra de Jesus na expiação foi mais efetiva que a dos sumos sacerdotes levíticos porque: (1) <strong>os sacerdotes levitas eram eles mesmos pecadores<\/strong>; (2) <strong>repetiam seus sacrifícios muitas vezes<\/strong> (9.25; 10.1-3,11), o que indica a imperfeição de seus esforços; (3) <strong>ofereciam sacrifícios de animais<\/strong> — e “é impossível que o sangue de touros e bodes remova pecados” (10.4).", "<strong>Por que isso é impossível?<\/strong> (a) As Escrituras predizem a <strong>substituição do sistema mosaico<\/strong> de sacrifícios por outro. (b) Com base em Jr 31.31-34, os sacrifícios de animais ofereciam apenas <strong>limpeza da carne<\/strong> (9.13-14), e não a <strong>purificação interior da consciência<\/strong>, necessária para o resgate total do pecado (9.15; 10.2,22). (c) O <strong>Sl 40.6-8<\/strong> fala do <strong>sacrifício voluntário do corpo de Cristo<\/strong> como substituição escatológica do sistema de sacrifícios da lei mosaica (10.7,9).", "<strong>2ª grande exortação (10.19-39):<\/strong> os princípios teológicos têm consequências práticas. A entrada no santuário celestial estava fechada por um <strong>véu, que aqui designa a carne de Jesus<\/strong>; por isso, é preciso manter a confiança, ter atitude ativa na comunidade e vigiar uns pelos outros. <strong>Desprezar as instruções da nova aliança trará castigo mais severo do que o da Lei de Moisés<\/strong> (Dt 17.2-7)."], "paragrafoIds": ["s-3-0", "s-3-1", "s-3-2", "s-3-3", "s-3-4", "s-3-5", "s-3-6"]}, {"subtitulo": "4ª e 5ª partes — Fé perseverante e posição dos cristãos (11.1—13.25)", "paragrafos": ["<strong>11.1-40:<\/strong> exemplos de fé dos antigos — Abel, Enoque e Noé; as provas de Abraão, até o sacrifício de Isaque; Jacó e José; Moisés, a saída do Egito e Jericó; Raabe e muitos outros. <strong>12.1-13:<\/strong> a nuvem de testemunhas, a imagem da corrida e os sofrimentos como parte da <strong>educação de Deus<\/strong> — o autor chega a falar em “bastardos” e chama Deus de “Pai dos espíritos”.", "<strong>12.14—13.18:<\/strong> paz com todos; a “raiz de amargura”; o terror que a antiga aliança inspira e a glória da nova. 13.1-6: amor fraterno, moral matrimonial e desapego das riquezas. 13.7-19: os antigos dirigentes morreram, mas <strong>Jesus permanece sumo sacerdote para sempre<\/strong>; os “alimentos” de 13.9-10 talvez sejam as refeições sacrificais do judaísmo; há uma comparação entre o Dia da // ===== PERSISTÊNCIA (só conveniência: o site funciona sem ela) =====
function carregarProgresso() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function gravarProgresso() {
  try {
    progresso.__diss = dissRespostas;
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progresso));
  } catch (e) { /* armazenamento indisponível */ }
}

function ring(pct, size) {
  size = size || 34;
  const r = (size - 4) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>
    <span class="ring-label">${Math.round(pct)}%</span>
  </div>`;
}

function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ===== SIMULADOS =====
function getSim(key) {
  if (!key) return null;
  if (key[0] === 's' && !key.includes(':')) {
    const i = Number(key.slice(1));
    const s = SIMULADOS[i];
    if (!s) return null;
    return { titulo: 'Simulado ' + s.numero, eyebrow: `Simulado ${s.numero} de ${SIMULADOS.length} · formato da prova`, ids: s.ids, diss: s.diss, idx: i };
  }
  if (key.startsWith('topico:')) {
    const t = key.slice(7);
    if (!TOPICOS[t]) return null;
    return { titulo: TOPICOS[t], eyebrow: 'Treino por tópico', ids: QUESTOES.filter(q => q.topico === t).map(q => q.id), diss: [] };
  }
  if (key === 'aleatorio') {
    const salvo = progresso[key];
    const prova = salvo && salvo.ids ? { ids: salvo.ids.filter(id => QMAP[id]), diss: (salvo.diss || []).filter(n => DMAP[n]) } : sortearProva();
    return { titulo: 'Prova aleatória', eyebrow: '7 objetivas + 2 discursivas sorteadas', ids: prova.ids, diss: prova.diss };
  }
  return null;
}

function embaralhar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Sorteia uma prova no formato real: MOLDE de objetivas + 2 discursivas
// (a de Hb 8–10 indicada pelo professor e outra em destaque).
function sortearProva() {
  const usados = new Set();
  const ids = [];
  MOLDE.forEach(t => {
    const opcoes = embaralhar(QUESTOES.filter(q => (t === 'livre' ? PROVA_TOPICOS.includes(q.topico) : q.topico === t) && !usados.has(q.id)));
    if (opcoes.length) { usados.add(opcoes[0].id); ids.push(opcoes[0].id); }
  });
  const destaque = DISSERTATIVAS.filter(d => d.destaque);
  const fixa = destaque.find(d => d.topico === 'alianca');
  const outra = embaralhar(destaque.filter(d => d !== fixa))[0];
  return { ids: embaralhar(ids), diss: [fixa, outra].filter(Boolean).map(d => d.numero) };
}

function salvarProgressoAtual() {
  if (view === 'simulado' && simKey) {
    const sim = getSim(simKey);
    progresso[simKey] = { respostas: { ...respostas }, corrigido, ids: sim ? sim.ids : undefined, diss: sim ? sim.diss : undefined };
    gravarProgresso();
  }
}

function startSim(key) {
  salvarProgressoAtual();
  view = 'simulado';
  simKey = String(key);
  returnTo = null;
  const salvo = progresso[simKey];
  if (salvo) {
    respostas = { ...(salvo.respostas || {}) };
    corrigido = !!salvo.corrigido;
  } else {
    respostas = {};
    corrigido = false;
    if (simKey === 'aleatorio') progresso.aleatorio = { respostas: {}, corrigido: false, ...sortearProva() };
  }
  renderSim();
  window.scrollTo({ top: 0 });
}

function novoAleatorio() {
  delete progresso.aleatorio;
  gravarProgresso();
  view = 'home';
  startSim('aleatorio');
}

function reiniciarSimulado() {
  if (!window.confirm('Isso vai apagar suas respostas deste simulado. Tem certeza que quer recomeçar do zero?')) return;
  const salvo = simKey === 'aleatorio' && progresso.aleatorio ? progresso.aleatorio : {};
  respostas = {};
  corrigido = false;
  progresso[simKey] = { respostas: {}, corrigido: false, ids: salvo.ids, diss: salvo.diss };
  gravarProgresso();
  renderSim();
}

function escolher(id, letra) {
  if (corrigido) return;
  respostas[id] = letra;
  salvarProgressoAtual();
  renderSim(true);
}

function setSimDiss(n, val) {
  respostas['d_' + n] = val;
  salvarProgressoAtual();
}

function corrigir() {
  corrigido = true;
  salvarProgressoAtual();
  renderSim();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function calcScore(sim, resp) {
  let ok = 0;
  sim.ids.forEach(id => { if (resp[id] && resp[id] === QMAP[id].correta) ok++; });
  return { ok, total: sim.ids.length };
}

function scorePorTopico(sim) {
  const out = {};
  sim.ids.forEach(id => {
    const q = QMAP[id];
    out[q.topico] = out[q.topico] || { ok: 0, total: 0 };
    out[q.topico].total++;
    if (respostas[id] === q.correta) out[q.topico].ok++;
  });
  return out;
}

    </div>
    <div class="topbar-right">
      ${isFixo ? `<select class="select-pill" onchange="startSim(this.value)">

      </select>` : ''}
      <button class="btn-pill" onclick="reiniciarSimulado()" title="Apagar respostas e recomeçar">${ICON_RESET} Reiniciar</button>

    html += `<div class="placar">
      <div class="placar-top">
        <div class="placar-icon">${ICON_CHECK}</div>
        <div>
          <div class="placar-titulo">Objetivas: ${sc.ok} de ${sc.total}</div>
          <div class="placar-sub">Leia o comentário de cada questão${sim.diss && sim.diss.length ? ' e confira as discursivas no fim da página' : ''}.</div>
        </div>
      </div>
      ${Object.keys(porTopico).map(t => {
        const r = porTopico[t];
        const p = Math.round(r.ok / r.total * 100);
        return `<div class="placar-row">
          <span class="placar-row-label">${TOPICOS[t]}</span>
          <div class="placar-bar-wrap"><div class="placar-bar bar-mult" style="width:${p}%"></div></div>
          <span class="placar-score">${r.ok}<small>/${r.total}</small></span>
        </div>`;
      }).join('')}
      <div class="placar-total">
        <span class="placar-total-label">Aproveitamento</span>
        <span class="placar-total-value">${Math.round(sc.ok / sc.total * 100)}%</span>
      </div>
    </div>`;
  } else {
    html += `<div class="page-head">
      <span class="page-eyebrow">${sim.eyebrow}</span>
      <h1 class="page-title">Múltipla escolha</h1>
      <p class="page-sub">${answered} de ${total} questões respondidas · marque uma alternativa por questão</p>
    </div>`;
  }

  sim.ids.forEach((id, n) => {
    const q = QMAP[id];
    const sel = respostas[id];
    let cardCls = '';
    if (corrigido) cardCls = sel === q.correta ? 'correct' : 'incorrect';
    html += `<div class="card ${cardCls}">
      <div class="q-head">
        <span class="q-num">${n + 1}</span>
        <div style="flex:1">
          <span class="q-tag">${TOPICOS[q.topico]}</span>
          <p class="q-enunciado">${q.enunciado}</p>
        </div>
      </div>
      <div class="alt-list">
        ${q.alternativas.map(alt => {
          let cls = sel === alt.letra ? 'sel' : '';
          let badge = '';
          if (corrigido) {
            if (alt.letra === q.correta && sel === alt.letra) { cls = 'acerto'; badge = `<span class="alt-badge" style="color:var(--green)">${ICON_CHECK}</span>`; }
            else if (alt.letra === q.correta) { cls = 'perdida'; badge = `<span class="alt-badge" style="color:var(--amber)">${ICON_ARROW}</span>`; }
            else if (sel === alt.letra) { cls = 'errada'; badge = `<span class="alt-badge" style="color:var(--red)">${ICON_X}</span>`; }
            else cls = '';
          }
          return `<button class="alt ${cls}" onclick="escolher('${q.id}','${alt.letra}')" ${corrigido ? 'style="cursor:default"' : ''}>
            <span class="alt-letra">${alt.letra}</span>
            <span class="alt-texto">${alt.texto}</span>
            ${badge}
          </button>`;
        }).join('')}
      </div>
      ${corrigido ? `<div class="coment-box">
        <span class="gab-label">${sel === q.correta ? 'Correto' : (sel ? 'Resposta certa: ' + q.correta : 'Não respondida · certa: ' + q.correta)}</span>${q.comentario}
        ${q.fonte && q.fonte.length ? `<br><button class="btn-fonte" onclick="showFonteModal('${q.fonte.join(',')}')">📖 Ver no material</button>` : ''}
      </div>` : ''}
    </div>`;
  });

  if (sim.diss && sim.diss.length) {
    html += `<div class="section-label">Discursivas <span class="count">${sim.diss.length}</span></div>
      <p class="section-hint">${corrigido ? 'Compare sua resposta com o gabarito.' : 'Escreva sua resposta. O gabarito aparece depois de corrigir.'}</p>`;
    sim.diss.forEach((num, k) => {
      const d = DMAP[num];
      const val = respostas['d_' + num] || '';
      html += `<div class="card">
        <div class="q-head">
          <span class="q-num">${total + k + 1}</span>
          <div style="flex:1">
            <span class="q-tag">${TOPICOS[d.topico]}</span>
            <p class="q-enunciado">${d.enunciado}</p>
          </div>
        </div>
        <textarea class="q-textarea" rows="4" placeholder="Sua resposta…" oninput="setSimDiss(${num}, this.value)">${escapeAttr(val)}</textarea>
        ${corrigido ? `<div class="gab-box visible">
          <span class="gab-label">Gabarito</span>${d.gabarito}
          ${d.fonte && d.fonte.length ? `<br><button class="btn-fonte" onclick="showFonteModal('${d.fonte.join(',')}')">📖 Ver no material</button>` : ''}
        </div>` : ''}
      </div>`;
    });
  }

  if (!corrigido) {
    html += `<div class="action-card">
      <p>${answered < total ? `Faltam ${total - answered} questões para concluir.` : 'Tudo respondido. Hora de corrigir!'}</p>
      <button class="btn-block btn-success" onclick="corrigir()">Corrigir simulado</button>
    </div>`;
  } else {
    let next = '';
    if (isFixo && sim.idx < SIMULADOS.length - 1) next = `<button class="btn-block btn-primary" onclick="startSim('s${sim.idx + 1}')">Próximo simulado →</button>`;
    if (simKey === 'aleatorio') next = `<button class="btn-block btn-primary" onclick="novoAleatorio()">🎲 Sortear outra prova</button>`;
    html += `<div class="action-card">
      <div class="action-row">
        ${next}
        <button class="btn-block btn-ghost" onclick="renderHome()">Voltar ao início</button>
      </div>
    </div>`;
  }

  html += '</div>';
  document.getElementById('root').innerHTML = html;
  if (keepScroll) window.scrollTo({ top: y });
}

// ===== DISSERTATIVAS =====
function setDiss(n, val) {
  dissRespostas['d_' + n] = val;
  gravarProgresso();
}

function toggleGab(num) {
  const box = document.getElementById('gab_' + num);
  if (box) box.classList.toggle('visible');
}

function renderDissertativas() {
  salvarProgressoAtual();
  view = 'dissertativas';
  returnTo = null;
  let html = `<div class="topbar">
    <div class="topbar-left"><span class="topbar-title">Questões Dissertativas</span></div>
    <div class="topbar-right">
      <button class="btn-pill" onclick="renderHome()">← Início</button>
    </div>
  </div>`;

  html += '<div class="wrap">';
  html += `<div class="page-head">
    <span class="page-eyebrow">${DISSERTATIVAS.length} questões · treino</span>
    <h1 class="page-title">Dissertativas</h1>
    <p class="page-sub">Na prova caem 2 discursivas, e uma delas é sobre Hebreus 8–10. Responda com suas palavras e depois compare com o gabarito.</p>
  </div>`;

  const grupos = [{ titulo: '★ Seguem a orientação do professor', qs: DISSERTATIVAS.filter(q => q.destaque) }];
  Object.keys(TOPICOS).forEach(t => {
    const qs = DISSERTATIVAS.filter(q => !q.destaque && q.topico === t);
    if (qs.length) grupos.push({ titulo: 'Treino extra · ' + TOPICOS[t], qs });
  });
  grupos.forEach(g => {
    html += `<div class="section-label diss-group">${g.titulo} <span class="count">${g.qs.length}</span></div>`;
    g.qs.forEach(q => {
      const val = dissRespostas['d_' + q.numero] || '';
      html += `<div class="card">
        <div class="q-head">
          <span class="q-num">${q.numero}</span>
          <div style="flex:1"><span class="q-tag">${TOPICOS[q.topico]}</span><p class="q-enunciado">${q.enunciado}</p></div>
        </div>
        <textarea class="q-textarea" rows="3" placeholder="Sua resposta…" oninput="setDiss(${q.numero}, this.value)">${escapeAttr(val)}</textarea>
        <button class="btn-gab" onclick="toggleGab('d${q.numero}')">Ver gabarito</button>
        <div class="gab-box" id="gab_d${q.numero}">
          <span class="gab-label">Gabarito</span>${q.gabarito}
          ${q.fonte && q.fonte.length ? `<br><button class="btn-fonte" onclick="showFonteModal('${q.fonte.join(',')}')">📖 Ver no material</button>` : ''}
        </div>
      </div>`;
    });
  });

  html += '</div>';
  document.getElementById('root').innerHTML = html;
}

// ===== FONTE / MODAL =====
function findParagrafo(pid) {
  for (let li = 0; li < MATERIA.length; li++) {
    const licao = MATERIA[li];
    for (const secao of licao.secoes) {
      const idx = secao.paragrafoIds.indexOf(pid);
      if (idx !== -1) return { licaoIdx: li, licao, subtitulo: secao.subtitulo, texto: secao.paragrafos[idx] };
    }
  }
  return null;
}

function showFonteModal(idsStr) {
  closeFonteModal();
  const ids = idsStr.split(',');
  const trechos = ids.map(findParagrafo).filter(Boolean);
  if (!trechos.length) return;
  const partes = [...new Set(trechos.map(t => t.licao.rotulo + ' — ' + t.licao.titulo))];

  const container = document.createElement('div');
  container.id = 'fonte-modal-container';
  container.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeFonteModal()">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-header-text">Trecho do material de estudo</div>
          <div class="modal-header-sub">${partes.join(' · ')}</div>
        </div>
        <button class="modal-close" onclick="closeFonteModal()">✕</button>
      </div>
      <div class="modal-body">
        ${trechos.map(t => `<p class="modal-paragrafo"><strong style="color:var(--teal)">${t.subtitulo}</strong><br>${t.texto}</p>`).join('')}
      </div>
      <div class="modal-footer">
        <button class="modal-link-btn" onclick="goToFonteInMaterial('${idsStr}')">Abrir no material →</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(container);
}

function closeFonteModal() {
  const el = document.getElementById('fonte-modal-container');
  if (el) el.remove();
}

function goToFonteInMaterial(idsStr) {
  closeFonteModal();
  const ids = idsStr.split(',');
  const first = findParagrafo(ids[0]);
  if (!first) return;
  if (view === 'simulado') { salvarProgressoAtual(); returnTo = { view: 'simulado' }; }
  else if (view === 'dissertativas') returnTo = { view: 'dissertativas' };
  renderLicao(first.licaoIdx, ids);
  setTimeout(() => {
    const el = document.getElementById(ids[0]);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

function voltarParaOrigem() {
  if (!returnTo) return renderHome();
  const destino = returnTo;
  returnTo = null;
  if (destino.view === 'simulado') { view = 'simulado'; renderSim(); }
  else if (destino.view === 'dissertativas') renderDissertativas();
  else renderHome();
}

// ===== MATERIAL DE ESTUDO =====
function renderMateriaIndex() {
  salvarProgressoAtual();
  view = 'materia-index';
  let html = `<div class="topbar">
    <div class="topbar-left"><span class="topbar-title">Material de Estudo</span></div>
    <div class="topbar-right">
      <button class="btn-pill" onclick="renderHome()">← Início</button>
    </div>
  </div>`;

  html += '<div class="wrap">';
  html += `<div class="page-head">
    <span class="page-eyebrow">Matéria da AV1</span>
    <h1 class="page-title">Material de Estudo</h1>
    <p class="page-sub">Resumo das fontes da prova. As questões apontam para os trechos daqui.</p>
  </div>`;

  html += '<div class="materia-toc">';
  MATERIA.forEach((licao, idx) => {
    html += `<button class="materia-toc-item" onclick="renderLicao(${idx})">
      <span class="materia-toc-num">
        <span class="materia-toc-num-label">Parte</span>
        <span class="materia-toc-num-value">${licao.numero}</span>
      </span>
      <span class="materia-toc-text">
        <span class="materia-toc-titulo">${licao.titulo}</span>
        <span class="materia-fonte" style="display:block;margin-top:.1rem">${licao.rotulo}</span>
      </span>
      <span class="materia-toc-arrow">${ICON_ARROW}</span>
    </button>`;
  });
  html += '</div></div>';
  document.getElementById('root').innerHTML = html;
}

function renderLicao(idx, highlightIds) {
  view = 'licao';
  currentLicao = idx;
  const licao = MATERIA[idx];
  if (!licao) return renderMateriaIndex();

  let html = `<div class="topbar">
    <div class="topbar-left"><span class="topbar-title">${licao.titulo}</span></div>
    <div class="topbar-right">
      ${returnTo ? `<button class="btn-pill accent" onclick="voltarParaOrigem()">${ICON_ARROW_LEFT} Voltar à questão</button>` : ''}
      <button class="btn-pill" onclick="renderMateriaIndex()">📖 Material</button>
      <button class="btn-pill" onclick="renderHome()">Início</button>
    </div>
  </div>`;

  html += '<div class="wrap">';
  html += '<div class="licao-nav">';
  MATERIA.forEach((l, i) => {
    html += `<button class="licao-nav-btn ${i === idx ? 'active' : ''}" onclick="renderLicao(${i})">${l.numero}. ${l.rotulo}</button>`;
  });
  html += '</div>';

  html += `<div class="page-head">
    <span class="page-eyebrow">Parte ${licao.numero} · ${licao.rotulo}</span>
    <h1 class="page-title">${licao.titulo}</h1>
    <p class="materia-fonte">${licao.fonte}</p>
  </div>`;

  licao.secoes.forEach(secao => {
    html += `<div class="licao-secao">
      <h3 class="licao-subtitulo">${secao.subtitulo}</h3>
      ${secao.paragrafos.map((p, pIdx) => {
        const pid = secao.paragrafoIds[pIdx];
        const hl = highlightIds && highlightIds.includes(pid);
        return `<p class="licao-paragrafo ${hl ? 'highlighted' : ''}" id="${pid}">${p}</p>`;
      }).join('')}
    </div>`;
  });

  const prevIdx = idx - 1, nextIdx = idx + 1;
  const hasPrev = prevIdx >= 0, hasNext = nextIdx < MATERIA.length;
  html += `<div class="licao-footer-nav">
    <button class="licao-footer-btn" onclick="renderLicao(${prevIdx})" ${!hasPrev ? 'disabled' : ''}>← ${hasPrev ? 'Parte ' + MATERIA[prevIdx].numero : 'Anterior'}</button>
    <button class="licao-footer-btn" onclick="renderLicao(${nextIdx})" ${!hasNext ? 'disabled' : ''}>${hasNext ? 'Parte ' + MATERIA[nextIdx].numero : 'Próxima'} →</button>
  </div>`;

  html += '</div>';
  document.getElementById('root').innerHTML = html;
  if (!highlightIds) window.scrollTo({ top: 0 });
}

renderHome();
</script>
</body>
</html>
